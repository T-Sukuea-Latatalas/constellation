    let frame = 0;
    function loop() {
      frame++;

      // 再生中のDOM銘板フェード同期・終了判定
      if (playback.active) {
        const pb = getPlaybackMetrics(performance.now());
        if (!recorderState.recording) {
          const capAlpha = easeOutCubic((pb.elapsed - pb.tCaptionStart) / playback.captionFade);
          plateCaption.style.opacity = String(capAlpha);
        }
        if (pb.elapsed >= pb.totalDur) {
          stopPlayback(true);
        }
      }

      renderToContext(ctx, width, height, getScale(), frame, false);
      requestAnimationFrame(loop);
    }

    // --- 観測再生 ＆ 動画書き出し ---
    function getSupportedVideoMime() {
      if (typeof MediaRecorder === 'undefined' || typeof canvas.captureStream !== 'function') {
        return null;
      }
      const candidates = [
        { mime: 'video/mp4;codecs=avc1', ext: 'mp4' },
        { mime: 'video/mp4', ext: 'mp4' },
        { mime: 'video/webm;codecs=vp9', ext: 'webm' },
        { mime: 'video/webm;codecs=vp8', ext: 'webm' },
        { mime: 'video/webm', ext: 'webm' }
      ];
      for (const c of candidates) {
        if (MediaRecorder.isTypeSupported(c.mime)) return c;
      }
      return { mime: '', ext: 'webm' };
    }

    const videoCapable = getSupportedVideoMime();
    if (videoCapable) {
      recordVideoBtn.style.display = 'inline-flex';
    }

    function updatePlaybackControlsUI() {
      replayLabel.textContent = playback.active ? '停止' : '観測再生';
      replayIcon.innerHTML = playback.active
        ? '<rect x="4" y="4" width="8" height="8"/>'
        : '<path d="M5 3.5l7 4.5-7 4.5z"/>';
      recordVideoBtn.classList.toggle('recording', recorderState.recording);
      recordLabel.textContent = recorderState.recording ? '記録中…' : '動画保存';
      replayBtn.disabled = recorderState.recording;
    }

    function startPlayback(withRecording = false) {
      if (playback.active) stopPlayback(false);

      playback.active = true;
      playback.startTime = performance.now();

      if (!withRecording) {
        plateCaption.style.opacity = '0';
      } else if (videoCapable) {
        try {
          const stream = canvas.captureStream(30);
          const options = videoCapable.mime ? { mimeType: videoCapable.mime } : undefined;
          const mr = new MediaRecorder(stream, options);
          recorderState.chunks = [];
          recorderState.mimeType = videoCapable.mime || mr.mimeType || 'video/webm';
          recorderState.ext = videoCapable.ext;
          recorderState.recorder = mr;
          recorderState.recording = true;
          recorderState.canceled = false;

          document.body.classList.add('recording-video');

          mr.ondataavailable = ev => {
            if (ev.data && ev.data.size > 0) recorderState.chunks.push(ev.data);
          };
          mr.onstop = () => {
            const wasCanceled = recorderState.canceled;
            const chunks = recorderState.chunks;
            const mime = recorderState.mimeType;
            const ext = recorderState.ext;
            recorderState.recording = false;
            recorderState.recorder = null;
            recorderState.chunks = [];
            document.body.classList.remove('recording-video');
            updatePlaybackControlsUI();

            if (!wasCanceled && chunks.length > 0) {
              const blob = new Blob(chunks, { type: mime });
              const url = URL.createObjectURL(blob);
              const slug = (nameInput.value.trim() || 'asterism_motion').replace(/[\\/:*?"<>|]/g, '_');
              const a = document.createElement('a');
              a.download = `${slug}.${ext}`;
              a.href = url;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              setTimeout(() => URL.revokeObjectURL(url), 1500);
            }
          };

          mr.start(100);
        } catch (err) {
          console.warn('MediaRecorder start failed:', err);
          recorderState.recording = false;
          document.body.classList.remove('recording-video');
        }
      }

      updatePlaybackControlsUI();
    }

    function stopPlayback(completedNormally = false) {
      if (!playback.active && !recorderState.recording) return;
      playback.active = false;
      plateCaption.style.opacity = '';

      if (recorderState.recording && recorderState.recorder) {
        recorderState.canceled = !completedNormally;
        if (recorderState.recorder.state !== 'inactive') {
          recorderState.recorder.stop();
        }
      }
      updatePlaybackControlsUI();
    }

    // --- 書き出し・プレビュー＆共有モーダル ---
    function generatePlateBlob(ratioKey, callback) {
      const preset = EXPORT_PRESETS[ratioKey] || EXPORT_PRESETS['4:3'];
      const expW = preset.w;
      const expH = preset.h;
      const offCanvas = document.createElement('canvas');
      offCanvas.width = expW;
      offCanvas.height = expH;
      const offCtx = offCanvas.getContext('2d');

      const m = expW < 1150 ? 40 : 36;
      const title = nameInput.value.trim();
      const story = storyInput.value.trim();
      const maxTextWidth = Math.min(740, expW - m * 2 - 72);
      let captionHeight = 0;
      if (story) {
        offCtx.font = '400 15px "Noto Sans JP", sans-serif';
        captionHeight += wrapLines(offCtx, story, maxTextWidth, 4).length * 24;
      }
      if (title) {
        captionHeight += (story ? 18 : 0) + 34;
      }

      const safeTop = m + 80;
      const safeBottom = expH - m - 34 - captionHeight - (captionHeight > 0 ? 48 : 24);
      const availX = expW / 2 - (m + 66);
      const availUp = expH / 2 - safeTop;
      const availDown = Math.max(120, safeBottom - expH / 2);

      let exportScale = Math.min(expW, expH) * (expH > expW ? 0.96 : 1.0);
      for (const s of stars) {
        if (Math.abs(s.nx) > 1e-5) {
          exportScale = Math.min(exportScale, availX / Math.abs(s.nx));
        }
        if (s.ny < -1e-5) {
          exportScale = Math.min(exportScale, availUp / (-s.ny));
        } else if (s.ny > 1e-5) {
          exportScale = Math.min(exportScale, availDown / s.ny);
        }
      }
      exportScale = Math.max(240, exportScale);

      renderToContext(offCtx, expW, expH, exportScale, frame, true);

      if (offCanvas.toBlob) {
        offCanvas.toBlob(blob => {
          offCanvas.width = 0;
          offCanvas.height = 0;
          callback(blob);
        }, 'image/png');
      } else {
        const dataUrl = offCanvas.toDataURL('image/png');
        offCanvas.width = 0;
        offCanvas.height = 0;
        fetch(dataUrl).then(r => r.blob()).then(callback).catch(() => callback(null));
      }
    }

    async function copyTextWithFeedback(text, labelEl, origText, doneText) {
      let copied = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch (_) {}

      if (!copied) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          copied = document.execCommand('copy');
        } catch (_) {}
        document.body.removeChild(ta);
      }

      if (copied) {
        labelEl.textContent = doneText;
        clearTimeout(labelEl._timer);
        labelEl._timer = setTimeout(() => {
          labelEl.textContent = origText;
        }, 1800);
      }
    }

        if (mode === 'select') {
          selectedStarIds.clear();
          syncSelectionUI();
        }
      }
    });

    // 初期星図（「あと1本で完成する未完の星座」）
    function initInitialChart() {
      stars = [];
      lines = [];
      nextId = 1;
      const initialStars = [
        { nx: -0.22, ny: -0.05, size: 3.6, color: '#9ec5ff' },
        { nx: -0.09, ny: -0.08, size: 3.6, color: '#f2f6ff' },
        { nx:  0.03, ny: -0.02, size: 5.2, color: '#f2f6ff' },
        { nx:  0.00, ny:  0.14, size: 3.6, color: '#ffe7ba' },
        { nx:  0.14, ny: -0.13, size: 3.6, color: '#f2f6ff' },
        { nx:  0.25, ny: -0.19, size: 5.2, color: '#ffe7ba' } // 孤立星（最後の1星）
      ];
      initialStars.forEach(s => stars.push({ id: nextId++, ...s }));
      lines = [
        { from: 1, to: 2 },
        { from: 2, to: 3 },
        { from: 3, to: 4 },
        { from: 3, to: 5 }
      ];
      currentSeedLabel = '';
      isolatedGuideMode = 'isolated';
      nameInput.value = '白鳥の片翼';
      storyInput.value = '真夜中、観測窓の隅で最後の一星が結ばれるのを待っている。';
      updateCaption();
      setMode('connect');
      updateTelemetry();
    }

    if (window.ResizeObserver) {
      new ResizeObserver(syncDockMetric).observe(dock);
      new ResizeObserver(syncDockMetric).observe(selectionBar);
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncDockMetric);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 150));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
    }
    window.addEventListener('hashchange', () => {
      loadFromUrlHash();
    });

    resize();
    pointerPos = { x: width / 2, y: height / 2 };
    if (!loadFromUrlHash()) {
      initInitialChart();
    }
    syncOptionBarEmphasis();
    syncSelectionUI();
    loop();
  </script>
</body>
</html>
