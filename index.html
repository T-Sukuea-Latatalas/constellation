
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ASTERISM — 天球製図室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #05070c;
      --surface: rgba(11, 14, 22, 0.88);
      --surface-solid: #0b0e16;
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.22);
      --brass: #d4b483;
      --brass-dim: rgba(212, 180, 131, 0.16);
      --danger: #d97c7c;
      --danger-dim: rgba(217, 124, 124, 0.16);
      --text-primary: #eceff4;
      --text-secondary: #8a93a6;
      --text-muted: #525a6b;
      --dock-offset: 84px;
      --selbar-bottom: 64px;
      --font-serif: 'Shippori Mincho', serif;
      --font-sans: 'Noto Sans JP', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    body.view-mode canvas {
      cursor: default !important;
    }

    .chrome {
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 左上：タイトルマーク */
    .brand {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      z-index: 10;
      display: flex;
      align-items: baseline;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--text-primary);
    }

    .brand-sub {
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--text-secondary);
    }

    /* 銅版画の欄外注釈風マイクロコピー */
    .margin-note {
      position: fixed;
      top: calc(18px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      font-family: var(--font-serif);
      font-size: 11.5px;
      letter-spacing: 0.12em;
      color: rgba(212, 180, 131, 0.62);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      max-width: calc(100vw - 40px);
      overflow: hidden;
      text-overflow: ellipsis;
      transition: opacity 0.9s ease;
    }

    .margin-note.hidden {
      opacity: 0;
    }

    /* 左下：座標テレメトリ */
    .telemetry {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom));
      left: calc(18px + env(safe-area-inset-left));
      z-index: 5;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      line-height: 1.6;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .telemetry span {
      color: var(--text-secondary);
    }

    /* 右上：記録・設定ドロワー */
    .inspector {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 15;
      width: 272px;
      max-width: calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right));
      max-height: calc(100dvh - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .inspector.collapsed {
      width: auto;
      max-height: none;
    }

    .inspector-toggle {
      width: 100%;
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .inspector-toggle:hover {
      background: var(--surface-hover);
    }

    .inspector-toggle-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inspector-body {
      padding: 4px 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .inspector.collapsed .inspector-body {
      display: none;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }

    .field-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    input[type="text"], textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px;
      color: var(--text-primary);
      font-family: var(--font-serif);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      user-select: text;
      -webkit-user-select: text;
    }

    textarea {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.55;
      min-height: 68px;
      max-height: 140px;
      resize: vertical;
    }

    input[type="text"]::placeholder, textarea::placeholder {
      color: var(--text-muted);
      font-size: 12px;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--brass);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .seg-control {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 4px 9px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .seg-btn:hover {
      color: var(--text-primary);
    }

    .seg-btn.active {
      background: var(--brass-dim);
      color: var(--brass);
    }

    /* 選択モード用フローティングバー */
    .selection-bar {
      position: fixed;
      bottom: var(--selbar-bottom);
      left: 50%;
      transform: translateX(-50%);
      z-index: 11;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      width: max-content;
      max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
    }

    .selection-bar.visible {
      display: flex;
    }

    .selection-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--brass);
      padding: 0 4px;
      white-space: nowrap;
    }

    .sel-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-secondary);
      padding: 4px 8px;
      height: 26px;
      font-family: var(--font-sans);
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    .sel-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .sel-btn.danger {
      color: var(--danger);
      border-color: rgba(217, 124, 124, 0.35);
      background: var(--danger-dim);
    }

    .sel-btn.danger:hover {
      background: rgba(217, 124, 124, 0.25);
    }

    /* 下部ドック（操作バー） */
    .dock {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 6px;
      padding: 6px 8px;
      width: max-content;
      max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .dock-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 2px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      padding: 6px 8px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    .tool-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .tool-btn.active {
      color: var(--brass);
      background: var(--brass-dim);
      border-color: rgba(212, 180, 131, 0.35);
    }

    .tool-btn[data-mode="erase"].active {
      color: var(--danger);
      background: var(--danger-dim);
      border-color: rgba(217, 124, 124, 0.35);
    }

    .tool-btn.export-btn {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.04);
    }

    .tool-btn.export-btn:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    .tool-btn:disabled {
      opacity: 0.32;
      pointer-events: none;
    }

    .option-bar {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .option-bar.muted {
      opacity: 0.45;
    }

    .mag-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .mag-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      width: 24px;
      height: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mag-btn:hover {
      color: var(--text-primary);
    }

    .mag-btn.active {
      color: var(--brass);
      border-color: rgba(212, 180, 131, 0.4);
      background: var(--brass-dim);
    }

    .spectral-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 4px;
    }

    .spectral-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      padding: 0;
    }

    .spectral-dot.active {
      transform: scale(1.22);
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22);
    }

    .eraser-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .eraser-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      width: 26px;
      height: 26px;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eraser-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .eraser-btn.active {
      color: var(--danger);
      border-color: rgba(217, 124, 124, 0.4);
      background: var(--danger-dim);
    }

    .eraser-circle {
      border-radius: 50%;
      border: 1.3px solid currentColor;
      display: block;
    }

    .intersect-check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      height: 28px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-secondary);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .intersect-check:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .intersect-check input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      margin: 0;
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .intersect-check input[type="checkbox"]:checked {
      background: var(--brass);
      border-color: var(--brass);
    }

    .intersect-check input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 3.5px;
      top: 1px;
      width: 3.5px;
      height: 7px;
      border: solid #0b0e16;
      border-width: 0 1.6px 1.6px 0;
      transform: rotate(45deg);
    }

    .intersect-check:has(input:checked) {
      color: var(--brass);
      border-color: rgba(212, 180, 131, 0.4);
      background: var(--brass-dim);
    }

    /* 夜空のタイトル銘板（通常編集時はタップ可能） */
    .plate-caption {
      position: fixed;
      bottom: var(--dock-offset);
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      text-align: center;
      pointer-events: auto;
      cursor: pointer;
      width: min(84vw, 560px);
      padding: 6px 12px;
      border-radius: 6px;
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.25s ease,
                  background 0.2s ease;
    }

    .plate-caption:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .plate-caption h2 {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(18px, 2.6vw, 26px);
      letter-spacing: 0.22em;
      color: rgba(236, 239, 244, 0.92);
    }

    .plate-caption.empty h2 {
      font-size: 13px;
      letter-spacing: 0.18em;
      color: rgba(212, 180, 131, 0.55);
    }

    .plate-caption p {
      margin: 6px 0 0;
      font-size: clamp(11px, 1.4vw, 12.5px);
      color: rgba(168, 178, 198, 0.78);
      line-height: 1.65;
      letter-spacing: 0.04em;
      word-break: break-word;
    }

    body.editing-text .dock,
    body.editing-text .selection-bar,
    body.editing-text .plate-caption {
      opacity: 0;
      pointer-events: none;
    }

    /* 言霊入力時はポップオーバーを画面上部に保持するため、背面干渉要素のみ抑える */
    body.editing-cipher .dock,
    body.editing-cipher .selection-bar,
    body.editing-cipher .plate-caption {
      opacity: 0;
      pointer-events: none;
    }

    body.view-mode .chrome:not(.view-controls),
    body.view-mode .brand,
    body.view-mode .telemetry,
    body.view-mode .margin-note {
      opacity: 0;
      pointer-events: none;
    }

    body.view-mode .plate-caption {
      bottom: calc(36px + env(safe-area-inset-bottom));
      pointer-events: none;
      cursor: default;
      background: transparent;
    }

    body.recording-video .plate-caption {
      opacity: 0 !important;
    }

    /* 鑑賞モード右上コントロール */
    .view-controls {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      opacity: 0;
      pointer-events: none;
    }

    body.view-mode .view-controls {
      opacity: 0.9;
      pointer-events: auto;
    }

    .rec-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      display: inline-block;
    }

    .tool-btn.recording .rec-dot {
      animation: recPulse 1s infinite ease-in-out;
    }

    @keyframes recPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    /* 言霊星喚ポップオーバー（画面上部中央に静かに展開） */
    .popover-backdrop {
      position: fixed;
      inset: 0;
      z-index: 28;
      background: rgba(5, 7, 12, 0.42);
      display: none;
    }

    .popover-backdrop.open {
      display: block;
    }

    .cipher-popover {
      position: fixed;
      top: calc(64px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      width: min(92vw, 340px);
      padding: 14px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
    }

    .cipher-popover.open {
      display: flex;
    }

    .popover-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .popover-title {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.14em;
      color: var(--brass);
    }

    .popover-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin: 0;
    }

    .popover-actions {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .btn-primary {
      flex: 1;
      height: 32px;
      background: var(--brass-dim);
      border: 1px solid rgba(212, 180, 131, 0.45);
      border-radius: 4px;
      color: var(--brass);
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-primary:hover {
      background: rgba(212, 180, 131, 0.25);
    }

    .btn-secondary {
      flex: 1;
      height: 32px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }

    .close-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .close-icon-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    /* 書き出し・共有モーダル */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(3, 5, 10, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }

    .modal-backdrop.open {
      display: flex;
    }

    .export-modal {
      width: min(94vw, 620px);
      max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.85);
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .modal-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.16em;
      color: var(--brass);
    }

    .modal-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .ratio-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .ratio-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
    }

    .preview-stage {
      background: #030408;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .preview-stage img {
      max-width: 100%;
      max-height: min(44dvh, 380px);
      width: auto;
      height: auto;
      display: block;
      border-radius: 2px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
    }

    .preview-hint {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }

    .modal-actions-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .modal-actions-grid .btn-primary,
    .modal-actions-grid .btn-secondary {
      height: 36px;
      font-size: 12px;
      padding: 0 10px;
    }

    svg.icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    @media (max-width: 1024px) {
      .telemetry { display: none; }
      .dock-sep { display: none; }
      .dock {
        gap: 4px 8px;
        padding: 6px 8px;
      }
      .margin-note {
        top: calc(48px + env(safe-area-inset-top));
      }
    }

    @media (max-width: 640px) {
      .brand-sub { display: none; }
      .inspector:not(.collapsed) {
        top: calc(48px + env(safe-area-inset-top));
        width: calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right));
        max-height: calc(100dvh - 175px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      .tool-btn .label-text {
        display: none;
      }
      .tool-btn.show-label .label-text {
        display: inline;
      }
      .tool-btn {
        padding: 5px 6px;
      }
      .modal-actions-grid {
        grid-template-columns: 1fr;
      }
      .view-controls .label-text {
        display: none;
      }
    }
  </style>
</head>
<body>

  <canvas id="skyCanvas"></canvas>

  <!-- 左上ブランド -->
  <div class="brand">
    <span class="brand-title">ASTERISM</span>
    <span class="brand-sub">天球製図室</span>

  <!-- 欄外注釈風マイクロコピー -->

    STARS <span id="starCount">0</span> &nbsp;·&nbsp; SEGMENTS <span id="lineCount">0</span>

  <!-- 右上：記録・表示設定パネル -->

    <button class="inspector-toggle" id="inspectorToggle" type="button">
      <span class="inspector-toggle-left">
        <svg class="icon" viewBox="0 0 16 16"><path d="M3 2.5h10v11H3z"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"/></svg>
        <span>星図の記録</span>
      </span>
      <svg class="icon" id="chevronIcon" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
    </button>

    <div class="inspector-body">
      <div class="field">
        <label class="field-label" for="constellationName">Designation / 星座名</label>

      </div>
      <div class="field">
        <label class="field-label" for="constellationStory">Notes / 観測記録・由来</label>
        <textarea id="constellationStory" placeholder="星図に添える覚え書き"></textarea>

      <div class="setting-row">

      </div>
      <div class="setting-row">

          <button class="seg-btn" data-val="dashed" type="button">破線</button>

      </div>
    </div>
  </aside>

  <!-- 銘板キャプション（通常編集時はタップで記録欄を展開） -->

  <!-- 選択モード用コンテキストバー -->

    <button class="sel-btn" id="deselectAllBtn" type="button" style="display:none;">解除</button>

  <!-- 下部ツールバー -->

    <div class="dock-group">

    <div class="dock-sep"></div>

    <!-- 補助アクション -->

      <button class="tool-btn" id="scatterBtn" type="button" title="言葉から星を呼ぶ／無作為に星を散らす">

    <!-- 鑑賞・書き出し -->

          <button class="btn-secondary" id="copyChartUrlBtn" type="button">

  <script>
    const canvas = document.getElementById('skyCanvas');
    const ctx = canvas.getContext('2d');

    const dock = document.getElementById('dock');
    const marginNote = document.getElementById('marginNote');
    const selectionBar = document.getElementById('selectionBar');

    const selectAllBtn = document.getElementById('selectAllBtn');
    const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');
    const deselectAllBtn = document.getElementById('deselectAllBtn');

    const inspector = document.getElementById('inspector');
    const inspectorToggle = document.getElementById('inspectorToggle');
    const chevronIcon = document.getElementById('chevronIcon');
    const nameInput = document.getElementById('constellationName');
    const storyInput = document.getElementById('constellationStory');
    const plateCaption = document.getElementById('plateCaption');
    const captionTitle = document.getElementById('captionTitle');

    const coordRA = document.getElementById('coordRA');
    const coordDec = document.getElementById('coordDec');
    const starCountEl = document.getElementById('starCount');
    const lineCountEl = document.getElementById('lineCount');
    const undoBtn = document.getElementById('undoBtn');
    const intersectCheck = document.getElementById('intersectCheck');
    const starOptionsBar = document.getElementById('starOptionsBar');
    const eraserOptionsBar = document.getElementById('eraserOptionsBar');

    const cipherBackdrop = document.getElementById('cipherBackdrop');
    const cipherPopover = document.getElementById('cipherPopover');
    const cipherInput = document.getElementById('cipherInput');

    const exportModalBackdrop = document.getElementById('exportModalBackdrop');
    const exportPreviewImg = document.getElementById('exportPreviewImg');
    const replayBtn = document.getElementById('replayBtn');
    const replayLabel = document.getElementById('replayLabel');
    const replayIcon = document.getElementById('replayIcon');
    const recordVideoBtn = document.getElementById('recordVideoBtn');
    const recordLabel = document.getElementById('recordLabel');

    const SIZE_VALUES = [5.2, 3.6, 2.3];
    const COLOR_VALUES = ['#f2f6ff', '#9ec5ff', '#ffe7ba', '#ffb88c'];
    const GREEK_BAYER = ['α', 'β', 'γ', 'δ', 'ε', 'ζ', 'η', 'θ', 'ι', 'κ', 'λ', 'μ'];
    const EXPORT_PRESETS = {
      '4:3': { w: 1600, h: 1200 },
      '4:5': { w: 1200, h: 1500 },
      '9:16': { w: 1080, h: 1920 }
    };
    const DEFAULT_TITLES = new Set(['', '白鳥の片翼', '無名星図 I']);

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = 1;

    let mode = 'connect';
    let currentSize = 3.6;
    let currentColor = '#f2f6ff';
    let eraserRadius = 22;
    let showGrid = true;
    let lineStyle = 'solid';
    let currentSeedLabel = '';
    let exportRatio = '4:3';

    let stars = [];
    let lines = [];
    let history = [];
    let nextId = 1;
    let bgStars = [];

    // オンボーディング状態
    let marginNoteDismissed = false;

    // ポインター・ツール状態
    let activePointerId = null;

    let isPointerDown = false;
    let isPointerInside = false;

    let prevPos = { x: 0, y: 0 };
    let pointerPos = { x: width / 2, y: height / 2 };

    let shiftDownAtStart = false;

    let placingStar = null;
    let draggingStar = null;

    let selectedStarIds = new Set();
    let isDraggingSelection = false;
    let selectionDragOrigins = null;
    let selectionBox = null;
    let pressedStarInSelect = null;

    let selectedStar = null;
    let toggledSameStarInDown = false;

    let hoveredStar = null;
    let eraseSnapshot = null;
    let eraseDidDelete = false;

    let isEditingText = false;
    let isViewMode = false;
    let isCipherOpen = false;
    let isExportModalOpen = false;

    // プレビュー出力キャッシュ
    let currentPreviewBlob = null;
    let currentPreviewUrl = null;

    // アニメーション再生 & 動画録画状態
    let playback = {
      active: false,
      startTime: 0,
      starDelay: 150,
      starFade: 360,
      lineDur: 320,
      captionFade: 750,
      holdEnd: 1350,

    };

      recording: false,

    // ユーティリティ
    function hexToRgba(hex, alpha) {
      const clean = hex.replace('#', '');
      const full = clean.length === 3
        ? clean.split('').map(c => c + c).join('')
        : clean;
      const num = parseInt(full, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - Math.max(0, Math.min(1, t)), 3);
    }

    function easeInOutCubic(t) {
      const x = Math.max(0, Math.min(1, t));
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    function getScale(w = width, h = height) {
      return Math.min(w, h);
    }

    function toScreen(nx, ny, w = width, h = height, s = getScale(w, h)) {
      return { x: w / 2 + nx * s, y: h / 2 + ny * s };
    }

    function toNorm(sx, sy, w = width, h = height, s = getScale(w, h)) {
      return { nx: (sx - w / 2) / s, ny: (sy - h / 2) / s };
    }

    function calcCelestialCoord(nx, ny) {
      const raRatio = Math.max(0, Math.min(0.999, (nx + 0.85) / 1.7));
      const raTotalMin = Math.floor(raRatio * 24 * 60);
      const raH = String(Math.floor(raTotalMin / 60)).padStart(2, '0');
      const raM = String(raTotalMin % 60).padStart(2, '0');

      const decDegTotal = Math.max(-89, Math.min(89, Math.round(-ny * 90)));
      const decSign = decDegTotal >= 0 ? '+' : '-';
      const decAbs = String(Math.abs(decDegTotal)).padStart(2, '0');
      return { ra: `${raH}h ${raM}m`, dec: `${decSign}${decAbs}° 00'` };
    }

    function dismissMarginNote() {
      if (marginNoteDismissed) return;
      marginNoteDismissed = true;
      marginNote.classList.add('hidden');
    }

    function syncDockMetric() {
      const dockRect = dock.getBoundingClientRect();
      if (dockRect.height === 0) return;

      const selBarBottom = Math.max(0, height - dockRect.top) + 8;
      document.documentElement.style.setProperty('--selbar-bottom', `${selBarBottom}px`);

      let topBound = dockRect.top;
      if (selectionBar.classList.contains('visible')) {
        const selRect = selectionBar.getBoundingClientRect();
        if (selRect.height > 0) topBound = selRect.top;
      }
      const offset = Math.max(0, height - topBound) + 18;
      document.documentElement.style.setProperty('--dock-offset', `${offset}px`);
    }

    function syncSelectionUI() {
      const showBar = !isViewMode && mode === 'select';
      selectionBar.classList.toggle('visible', showBar);
      if (showBar) {
        const n = selectedStarIds.size;
        selectionCountEl.textContent = n > 0 ? `${n}個選択中` : '範囲ドラッグ・タップで選択';
        deleteSelectedBtn.style.display = n > 0 ? 'inline-flex' : 'none';
        deselectAllBtn.style.display = n > 0 ? 'inline-flex' : 'none';
        selectAllBtn.style.display = stars.length > 0 && n < stars.length ? 'inline-flex' : 'none';
      }
      requestAnimationFrame(syncDockMetric);
    }

    function resize() {
      if (isEditingText || recorderState.recording) return;
      const rect = canvas.getBoundingClientRect();
      width = rect.width || window.innerWidth;
      height = rect.height || window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      // 動画録画のエンコーダ互換性のため偶数ピクセルに揃える
      canvas.width = Math.round(width * dpr) & ~1;
      canvas.height = Math.round(height * dpr) & ~1;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (bgStars.length === 0) {
        initBgStars();
      }
      updateTelemetry();
      requestAnimationFrame(syncDockMetric);
    }

    function initBgStars() {
      bgStars = [];
      const tints = ['#ffffff', '#dce8ff', '#fff0db', '#cfd9eb'];
      for (let i = 0; i < 280; i++) {
        bgStars.push({
          u: Math.random(),
          v: Math.random(),
          r: Math.random() * 1.1 + 0.25,
          alpha: Math.random() * 0.45 + 0.08,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.015 + 0.004,
          tint: tints[Math.floor(Math.random() * tints.length)]
        });
      }
    }

    function updateTelemetry() {
      const norm = toNorm(pointerPos.x, pointerPos.y);
      const coord = calcCelestialCoord(norm.nx, norm.ny);
      coordRA.textContent = coord.ra;
      coordDec.textContent = coord.dec;
      starCountEl.textContent = stars.length;
      lineCountEl.textContent = lines.length;
    }

    function cloneState() {
      return {
        stars: stars.map(s => ({ ...s })),
        lines: lines.map(l => ({ ...l })),
        seed: currentSeedLabel
      };
    }

    function pushSnapshot(snap) {
      history.push(snap);
      if (history.length > 50) history.shift();
      undoBtn.disabled = history.length === 0;
    }

    function saveHistory() {
      pushSnapshot(cloneState());
    }

    function undo() {
      if (isViewMode || isModalActive() || history.length === 0) return;
      const prev = history.pop();
      stars = prev.stars;
      lines = prev.lines;
      currentSeedLabel = prev.seed || '';
      clearTransientStates();
      selectedStarIds.clear();
      undoBtn.disabled = history.length === 0;
      updateTelemetry();
      syncSelectionUI();
    }

    function clearTransientStates() {
      activePointerId = null;
      isPointerDown = false;
      placingStar = null;
      draggingStar = null;
      dragSnapshot = null;
      isDraggingSelection = false;
      selectionDragOrigins = null;
      selectionBox = null;
      pressedStarInSelect = null;
      selectedStar = null;
      toggledSameStarInDown = false;
      hoveredStar = null;
      eraseSnapshot = null;
      eraseDidDelete = false;
    }

    function isModalActive() {
      return isCipherOpen || isExportModalOpen;
    }

    // 決定論的PRNG（言霊星喚）
    function fnv1aBytes(str) {
      const bytes = new TextEncoder().encode(str);
      let h = 0x811c9dc5;
      for (let i = 0; i < bytes.length; i++) {
        h ^= bytes[i];
        h = Math.imul(h, 0x01000193);
      }
      return h >>> 0;
    }

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function generateStarsFromSeed(seedString, isRandomSeed = false) {
      const cleanSeed = seedString.trim();
      if (!cleanSeed) return;

      saveHistory();
      const rng = mulberry32(fnv1aBytes(cleanSeed));
      const count = 7 + Math.floor(rng() * 7); // 7〜13星
      const generated = [];
      const minDist = 0.088;

      for (let i = 0; i < count; i++) {
        let nx = 0, ny = 0;
        let placed = false;
        for (let attempt = 0; attempt < 60; attempt++) {
          // 中心寄りに優雅に分布するボックス型乱数
          const rx = (rng() + rng() - 1) * 0.34;
          const ry = (rng() + rng() - 1) * 0.27 - 0.02;
          const tooClose = generated.some(g => Math.hypot(g.nx - rx, g.ny - ry) < minDist);
          if (!tooClose) {
            nx = rx;
            ny = ry;
            placed = true;
            break;
          }
        }
        if (!placed) {
          nx = (rng() - 0.5) * 0.58;
          ny = (rng() - 0.5) * 0.44 - 0.02;
        }

        // 等級：最初の1〜2個に1等星を保証しつつ分布
        let size = 3.6;
        if (i === 0 || rng() < 0.18) size = 5.2;
        else if (rng() < 0.45) size = 2.3;

        const color = COLOR_VALUES[Math.floor(rng() * COLOR_VALUES.length)];
        generated.push({
          id: nextId++,
          nx,
          ny,
          size,
          color
        });
      }

      stars = generated;
      lines = [];
      currentSeedLabel = cleanSeed;
      isolatedGuideMode = 'challenge';

      const currentTitle = nameInput.value.trim();
      if (DEFAULT_TITLES.has(currentTitle)) {
        if (isRandomSeed) {
          nameInput.value = `${cleanSeed} 星群`;
        } else {
          const base = cleanSeed.slice(0, 12);
          nameInput.value = base.endsWith('座') ? base : `${base}座`;
        }
        storyInput.value = isRandomSeed
          ? '無作為の天球から掬い上げられた星群。'
          : `「${cleanSeed}」の名を宿して天球に招かれた星々。`;
        updateCaption();
      }

      updateTelemetry();
      setMode('connect');
    }

    // URLハッシュ エンコード／デコード
    function encodeBase64Url(str) {
      const bytes = new TextEncoder().encode(str);
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function decodeBase64Url(b64) {
      const padded = b64.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((b64.length + 3) % 4);
      const bin = atob(padded);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder().decode(bytes);
    }

    function buildChartShareUrl(isChallenge = false) {
      const idToIdx = new Map(stars.map((s, idx) => [s.id, idx]));
      const payload = {
        v: 1,
        n: nameInput.value.trim(),
        s: storyInput.value.trim(),
        sd: currentSeedLabel || '',
        g: showGrid ? 1 : 0,
        ls: lineStyle === 'dashed' ? 1 : 0,
        ch: isChallenge ? 1 : 0,
        st: stars.map(s => [
          Math.round(s.nx * 10000) / 10000,
          Math.round(s.ny * 10000) / 10000,
          Math.max(0, SIZE_VALUES.indexOf(s.size)),
          Math.max(0, COLOR_VALUES.indexOf(s.color))
        ]),
        ln: isChallenge
          ? []
          : lines
              .map(l => [idToIdx.get(l.from), idToIdx.get(l.to)])
              .filter(p => p[0] !== undefined && p[1] !== undefined)
      };
      const encoded = encodeBase64Url(JSON.stringify(payload));
      const base = window.location.href.split('#')[0];
      return `${base}#chart=${encoded}`;
    }

    function loadFromUrlHash() {
      const hash = window.location.hash || '';
      if (!hash || hash.length < 3) return false;

      try {
        if (hash.startsWith('#seed=')) {
          const seedStr = decodeURIComponent(hash.slice(6)).trim();
          if (!seedStr) return false;
          stars = [];
          lines = [];
          history = [];
          undoBtn.disabled = true;
          generateStarsFromSeed(seedStr, false);
          history = [];
          undoBtn.disabled = true;
          marginNote.textContent = 'この星群に線を結び、あなただけの星座を編み上げてください';
          return true;
        }

        if (hash.startsWith('#chart=')) {
          const jsonStr = decodeBase64Url(hash.slice(7));
          const data = JSON.parse(jsonStr);
          if (!data || !Array.isArray(data.st)) return false;

          nextId = 1;
          stars = [];
          lines = [];
          history = [];
          undoBtn.disabled = true;

          const idxToId = [];
          for (const item of data.st) {
            if (!Array.isArray(item) || item.length < 2) continue;
            const nx = Number(item[0]);
            const ny = Number(item[1]);
            if (!Number.isFinite(nx) || !Number.isFinite(ny)) continue;
            const sizeIdx = Math.min(SIZE_VALUES.length - 1, Math.max(0, Number(item[2]) || 0));
            const colorIdx = Math.min(COLOR_VALUES.length - 1, Math.max(0, Number(item[3]) || 0));
            const starObj = {
              id: nextId++,
              nx: Math.max(-1.5, Math.min(1.5, nx)),
              ny: Math.max(-1.5, Math.min(1.5, ny)),
              size: SIZE_VALUES[sizeIdx],
              color: COLOR_VALUES[colorIdx]
            };
            idxToId.push(starObj.id);
            stars.push(starObj);
          }

          const isChallenge = data.ch === 1;
          if (!isChallenge && Array.isArray(data.ln)) {
            for (const pair of data.ln) {
              if (!Array.isArray(pair) || pair.length < 2) continue;
              const idA = idxToId[pair[0]];
              const idB = idxToId[pair[1]];
              if (idA !== undefined && idB !== undefined) {
                addLineUnique(idA, idB);
              }
            }
          }

          nameInput.value = typeof data.n === 'string' ? data.n.slice(0, 28) : '';
          storyInput.value = typeof data.s === 'string' ? data.s : '';
          currentSeedLabel = typeof data.sd === 'string' ? data.sd : '';
          setGridVisible(data.g !== 0);
          setLineStyleValue(data.ls === 1 ? 'dashed' : 'solid');
          updateCaption();
          updateTelemetry();

          if (!isChallenge && lines.length > 0) {
            isolatedGuideMode = 'none';
            dismissMarginNote();
            toggleViewMode(true);
          } else {
            toggleViewMode(false);
            setMode('connect');
            isolatedGuideMode = 'challenge';
            marginNote.textContent = 'この星群に線を結び、あなただけの星座を編み上げてください';
            marginNoteDismissed = false;
            marginNote.classList.remove('hidden');
          }
          return true;
        }
      } catch (err) {
        console.warn('Invalid URL hash ignored:', err);
      }
      return false;
    }

    // 幾何計算ユーティリティ
    function findStarAt(sx, sy, threshold = 24) {
      let hit = null;
      let minD = threshold;
      for (const s of stars) {
        const p = toScreen(s.nx, s.ny);
        const d = Math.hypot(p.x - sx, p.y - sy);
        if (d < minD) {
          minD = d;
          hit = s;
        }
      }
      return hit;
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function segmentToSegmentDist(a, b, c, d) {
      const denom = (a.x - b.x) * (c.y - d.y) - (a.y - b.y) * (c.x - d.x);
      if (Math.abs(denom) > 1e-9) {
        const t = ((a.x - c.x) * (c.y - d.y) - (a.y - c.y) * (c.x - d.x)) / denom;
        const u = -((a.x - b.x) * (a.y - c.y) - (a.y - b.y) * (a.x - c.x)) / denom;
        if (t >= 0 && t <= 1 && u >= 0 && u <= 1) return 0;
      }
      return Math.min(
        distToSegment(a.x, a.y, c.x, c.y, d.x, d.y),
        distToSegment(b.x, b.y, c.x, c.y, d.x, d.y),
        distToSegment(c.x, c.y, a.x, a.y, b.x, b.y),
        distToSegment(d.x, d.y, a.x, a.y, b.x, b.y)
      );
    }

    function lineExists(idA, idB, list = lines) {
      return list.some(
        l => (l.from === idA && l.to === idB) || (l.from === idB && l.to === idA)
      );
    }

    function addLineUnique(idA, idB) {
      if (idA === idB) return;
      if (!lineExists(idA, idB, lines)) {
        lines.push({ from: idA, to: idB });
      }
    }

    function insertLineWithIntersections(idA, idB) {
      if (idA === idB || lineExists(idA, idB)) return;

      const starMap = new Map(stars.map(s => [s.id, s]));
      const s1 = starMap.get(idA);
      const s2 = starMap.get(idB);
      if (!s1 || !s2) return;

      if (!intersectCheck.checked) {
        lines.push({ from: idA, to: idB });
        return;
      }

      const x1 = s1.nx, y1 = s1.ny;
      const x2 = s2.nx, y2 = s2.ny;
      const eps = 1e-4;
      const scale = getScale();
      const mergeThresholdNorm = 8 / Math.max(scale, 1);
      const intersections = [];

      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        if (l.from === idA || l.from === idB || l.to === idA || l.to === idB) {
          continue;
        }
        const s3 = starMap.get(l.from);
        const s4 = starMap.get(l.to);
        if (!s3 || !s4) continue;

        const x3 = s3.nx, y3 = s3.ny;
        const x4 = s4.nx, y4 = s4.ny;

        const denom = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (Math.abs(denom) < 1e-9) continue;

        const t = ((x1 - x3) * (y3 - y4) - (y1 - y3) * (x3 - x4)) / denom;
        const u = -((x1 - x2) * (y1 - y3) - (y1 - y2) * (x1 - x3)) / denom;

        if (t > eps && t < 1 - eps && u > eps && u < 1 - eps) {
          const ix = x1 + t * (x2 - x1);
          const iy = y1 + t * (y2 - y1);

          const nearEndpoint = [s1, s2, s3, s4].some(
            ep => Math.hypot(ep.nx - ix, ep.ny - iy) < mergeThresholdNorm
          );
          if (nearEndpoint) continue;

          intersections.push({
            lineIndex: i,
            t,
            nx: ix,
            ny: iy
          });
        }
      }

      if (intersections.length === 0) {
        lines.push({ from: idA, to: idB });
        return;
      }

      intersections.sort((a, b) => a.t - b.t);

      const linesToRemove = new Set();
      const splitAdditions = [];
      const chainStarIds = [idA];

      for (const hit of intersections) {
        let starAtPoint = null;
        for (const existing of stars) {
          if (Math.hypot(existing.nx - hit.nx, existing.ny - hit.ny) < mergeThresholdNorm) {
            starAtPoint = existing;
            break;
          }
        }
        if (!starAtPoint) {
          starAtPoint = {
            id: nextId++,
            nx: hit.nx,
            ny: hit.ny,
            size: currentSize,
            color: currentColor
          };
          stars.push(starAtPoint);
        }

        const origLine = lines[hit.lineIndex];
        linesToRemove.add(hit.lineIndex);
        if (origLine.from !== starAtPoint.id) {
          splitAdditions.push({ from: origLine.from, to: starAtPoint.id });
        }
        if (starAtPoint.id !== origLine.to) {
          splitAdditions.push({ from: starAtPoint.id, to: origLine.to });
        }

        if (chainStarIds[chainStarIds.length - 1] !== starAtPoint.id) {
          chainStarIds.push(starAtPoint.id);
        }
      }

      if (chainStarIds[chainStarIds.length - 1] !== idB) {
        chainStarIds.push(idB);
      }

      lines = lines.filter((_, idx) => !linesToRemove.has(idx));
      for (const seg of splitAdditions) {
        addLineUnique(seg.from, seg.to);
      }
      for (let i = 0; i < chainStarIds.length - 1; i++) {
        addLineUnique(chainStarIds[i], chainStarIds[i + 1]);
      }
    }

    function connectStars(s1, s2) {
      if (!s1 || !s2 || s1.id === s2.id) return false;
      if (lineExists(s1.id, s2.id)) return false;
      saveHistory();
      insertLineWithIntersections(s1.id, s2.id);
      if (isolatedGuideMode === 'challenge' && lines.length > 0) {
        isolatedGuideMode = 'none';
      } else if (isolatedGuideMode === 'isolated') {
        const connectedSet = new Set();
        lines.forEach(l => { connectedSet.add(l.from); connectedSet.add(l.to); });
        if (stars.every(st => connectedSet.has(st.id))) {
          isolatedGuideMode = 'none';
        }
      }
      updateTelemetry();
      return true;
    }

    function resolveIntersectionsForMovedStars(movedStarIdSet) {
      if (!intersectCheck.checked || movedStarIdSet.size === 0) return;

      const affectedLines = [];
      const staticLines = [];
      for (const l of lines) {
        if (movedStarIdSet.has(l.from) || movedStarIdSet.has(l.to)) {
          affectedLines.push(l);
        } else {
          staticLines.push(l);
        }
      }

      if (affectedLines.length === 0) return;

      lines = staticLines;
      for (const l of affectedLines) {
        insertLineWithIntersections(l.from, l.to);
      }
      updateTelemetry();
    }

    function deleteSelectedStars() {
      if (selectedStarIds.size === 0) return;
      saveHistory();
      stars = stars.filter(s => !selectedStarIds.has(s.id));
      lines = lines.filter(l => !selectedStarIds.has(l.from) && !selectedStarIds.has(l.to));
      selectedStarIds.clear();
      updateTelemetry();
      syncSelectionUI();
    }

    function getStarsInBox(box) {
      const minX = Math.min(box.x1, box.x2);
      const maxX = Math.max(box.x1, box.x2);
      const minY = Math.min(box.y1, box.y2);
      const maxY = Math.max(box.y1, box.y2);
      const ids = [];
      for (const s of stars) {
        const p = toScreen(s.nx, s.ny);
        if (p.x >= minX && p.x <= maxX && p.y >= minY && p.y <= maxY) {
          ids.push(s.id);
        }
      }
      return ids;
    }

    function eraseAlongStroke(fromPos, toPos) {
      const deletedStarIds = new Set();

      for (const s of stars) {
        const p = toScreen(s.nx, s.ny);
        const hitDist = distToSegment(p.x, p.y, fromPos.x, fromPos.y, toPos.x, toPos.y);
        if (hitDist <= eraserRadius + s.size * 0.6) {
          deletedStarIds.add(s.id);
        }
      }

      let changed = false;
      if (deletedStarIds.size > 0) {
        stars = stars.filter(s => !deletedStarIds.has(s.id));
        lines = lines.filter(l => !deletedStarIds.has(l.from) && !deletedStarIds.has(l.to));
        deletedStarIds.forEach(id => selectedStarIds.delete(id));
        if (selectedStar && deletedStarIds.has(selectedStar.id)) {
          selectedStar = null;
        }
        changed = true;
      }

      const starMap = new Map(stars.map(s => [s.id, s]));
      const remainingLines = [];
      for (const l of lines) {
        const s1 = starMap.get(l.from);
        const s2 = starMap.get(l.to);
        if (!s1 || !s2) {
          changed = true;
          continue;
        }
        const p1 = toScreen(s1.nx, s1.ny);
        const p2 = toScreen(s2.nx, s2.ny);
        const d = segmentToSegmentDist(fromPos, toPos, p1, p2);
        if (d <= eraserRadius) {
          changed = true;
        } else {
          remainingLines.push(l);
        }
      }

      if (remainingLines.length !== lines.length) {
        lines = remainingLines;
      }

      if (changed) {
        eraseDidDelete = true;
        updateTelemetry();
      }
    }

    function clientToCanvas(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function updateCursor(isTouch) {
      if (isViewMode || isTouch || isModalActive()) {
        canvas.style.cursor = 'default';
        return;
      }
      if (mode === 'place') {
        canvas.style.cursor = 'crosshair';
      } else if (mode === 'move') {
        canvas.style.cursor = draggingStar ? 'grabbing' : (hoveredStar ? 'grab' : 'default');
      } else if (mode === 'select') {
        if (isDraggingSelection) canvas.style.cursor = 'grabbing';
        else if (selectionBox) canvas.style.cursor = 'crosshair';
        else if (hoveredStar) canvas.style.cursor = selectedStarIds.has(hoveredStar.id) ? 'grab' : 'pointer';
        else canvas.style.cursor = 'crosshair';
      } else if (mode === 'connect') {
        canvas.style.cursor = hoveredStar ? 'pointer' : 'crosshair';
      } else if (mode === 'erase') {
        canvas.style.cursor = 'none';
      }
    }

    // Pointer Events
    canvas.addEventListener('pointerdown', e => {
      if (isViewMode || isModalActive()) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (activePointerId !== null) return;

      e.preventDefault();
      dismissMarginNote();

      activePointerId = e.pointerId;
      lastPointerType = e.pointerType || 'mouse';
      isPointerDown = true;
      isPointerInside = true;
      didMove = false;
      shiftDownAtStart = !!e.shiftKey;

      const pos = clientToCanvas(e.clientX, e.clientY);
      downPos = { x: pos.x, y: pos.y };
      prevPos = { x: pos.x, y: pos.y };
      pointerPos = { x: pos.x, y: pos.y };
      updateTelemetry();

      const touchHitThreshold = lastPointerType === 'touch' ? 28 : 22;

      if (mode === 'place') {
        isolatedGuideMode = 'none';
        const norm = toNorm(pos.x, pos.y);
        placingStar = {
          nx: norm.nx,
          ny: norm.ny,
          size: currentSize,
          color: currentColor
        };
      } else if (mode === 'move') {
        const hit = findStarAt(pos.x, pos.y, touchHitThreshold);
        if (hit) {
          draggingStar = hit;
          dragSnapshot = cloneState();
        }
      } else if (mode === 'select') {
        const hit = findStarAt(pos.x, pos.y, touchHitThreshold);
        pressedStarInSelect = hit;
        if (hit) {
          if (selectedStarIds.has(hit.id)) {
            isDraggingSelection = true;
            dragSnapshot = cloneState();
            selectionDragOrigins = new Map();
            for (const s of stars) {
              if (selectedStarIds.has(s.id)) {
                selectionDragOrigins.set(s.id, { nx: s.nx, ny: s.ny });
              }
            }
          } else {
            dragSnapshot = cloneState();
          }
        } else {
          selectionBox = { x1: pos.x, y1: pos.y, x2: pos.x, y2: pos.y };
        }
      } else if (mode === 'connect') {
        const hit = findStarAt(pos.x, pos.y, touchHitThreshold);
        toggledSameStarInDown = false;
        if (hit) {
          if (selectedStar && selectedStar.id === hit.id) {
            toggledSameStarInDown = true;
          } else if (selectedStar && selectedStar.id !== hit.id) {
            connectStars(selectedStar, hit);
            selectedStar = null;
          } else {
            selectedStar = hit;
          }
        } else {
          selectedStar = null;
        }
      } else if (mode === 'erase') {
        isolatedGuideMode = 'none';
        eraseSnapshot = cloneState();
        eraseDidDelete = false;
        eraseAlongStroke(pos, pos);
      }

      updateCursor(lastPointerType !== 'mouse');
    });

    window.addEventListener('pointermove', e => {
      if (isViewMode || isModalActive()) {
        hoveredStar = null;
        return;
      }

      if (e.pointerType !== 'mouse' && (!isPointerDown || e.pointerId !== activePointerId)) {
        return;
      }
      if (isPointerDown && e.pointerId !== activePointerId) {
        return;
      }

      const pos = clientToCanvas(e.clientX, e.clientY);
      const isTouch = e.pointerType !== 'mouse';
      lastPointerType = e.pointerType || 'mouse';

      if (isPointerDown) {
        if (Math.hypot(pos.x - downPos.x, pos.y - downPos.y) > 5) {
          didMove = true;
        }
      }

      prevPos = { x: pointerPos.x, y: pointerPos.y };
      pointerPos = { x: pos.x, y: pos.y };
      updateTelemetry();

      if (!isTouch && !isPointerDown && (mode === 'move' || mode === 'connect' || mode === 'select')) {
        hoveredStar = findStarAt(pos.x, pos.y, 22);
      } else if (!isTouch && isPointerDown && mode === 'connect') {
        hoveredStar = findStarAt(pos.x, pos.y, 26);
      } else {
        hoveredStar = null;
      }

      if (isPointerDown) {
        if (mode === 'place' && placingStar) {
          const norm = toNorm(pos.x, pos.y);
          placingStar.nx = norm.nx;
          placingStar.ny = norm.ny;
        } else if (mode === 'move' && draggingStar) {
          const norm = toNorm(pos.x, pos.y);
          draggingStar.nx = norm.nx;
          draggingStar.ny = norm.ny;
        } else if (mode === 'select') {
          if (pressedStarInSelect && didMove) {
            if (!isDraggingSelection) {
              selectedStarIds = new Set([pressedStarInSelect.id]);
              isDraggingSelection = true;
              selectionDragOrigins = new Map([[
                pressedStarInSelect.id,
                { nx: pressedStarInSelect.nx, ny: pressedStarInSelect.ny }
              ]]);
              syncSelectionUI();
            }
            const downNorm = toNorm(downPos.x, downPos.y);
            const currNorm = toNorm(pos.x, pos.y);
            const dnx = currNorm.nx - downNorm.nx;
            const dny = currNorm.ny - downNorm.ny;
            for (const s of stars) {
              const orig = selectionDragOrigins.get(s.id);
              if (orig) {
                s.nx = orig.nx + dnx;
                s.ny = orig.ny + dny;
              }
            }
          } else if (selectionBox) {
            selectionBox.x2 = pos.x;
            selectionBox.y2 = pos.y;
          }
        } else if (mode === 'erase') {
          eraseAlongStroke(prevPos, pos);
        }
      }

      updateCursor(isTouch);
    });

    function finishPointer(e, isCancel) {
      if (!isPointerDown || e.pointerId !== activePointerId) return;

      const isTouch = e.pointerType !== 'mouse';
      const pos = clientToCanvas(e.clientX, e.clientY);
      pointerPos = { x: pos.x, y: pos.y };

      isPointerDown = false;
      activePointerId = null;

      if (!isViewMode && !isModalActive() && !isCancel) {
        if (mode === 'place' && placingStar) {
          saveHistory();
          stars.push({
            id: nextId++,
            nx: placingStar.nx,
            ny: placingStar.ny,
            size: placingStar.size,
            color: placingStar.color
          });
          updateTelemetry();
        } else if (mode === 'move' && draggingStar) {
          if (didMove && dragSnapshot) {
            pushSnapshot(dragSnapshot);
            resolveIntersectionsForMovedStars(new Set([draggingStar.id]));
          }
        } else if (mode === 'select') {
          if (isDraggingSelection && didMove) {
            if (dragSnapshot) {
              pushSnapshot(dragSnapshot);
              resolveIntersectionsForMovedStars(new Set(selectedStarIds));
            }
          } else if (pressedStarInSelect && !didMove) {
            if (selectedStarIds.has(pressedStarInSelect.id)) {
              selectedStarIds.delete(pressedStarInSelect.id);
            } else {
              selectedStarIds.add(pressedStarInSelect.id);
            }
          } else if (selectionBox) {
            if (didMove) {
              const hitIds = getStarsInBox(selectionBox);
              if (!shiftDownAtStart) selectedStarIds.clear();
              hitIds.forEach(id => selectedStarIds.add(id));
            } else {
              selectedStarIds.clear();
            }
          }
          syncSelectionUI();
        } else if (mode === 'connect') {
          if (didMove && selectedStar) {
            const target = findStarAt(pos.x, pos.y, isTouch ? 30 : 26);
            if (target && target.id !== selectedStar.id) {
              connectStars(selectedStar, target);
            }
            selectedStar = null;
          } else if (!didMove && toggledSameStarInDown) {
            selectedStar = null;
          }
        } else if (mode === 'erase') {
          if (eraseDidDelete && eraseSnapshot) {
            pushSnapshot(eraseSnapshot);
          }
        }
      }

      placingStar = null;
      draggingStar = null;
      dragSnapshot = null;
      isDraggingSelection = false;
      selectionDragOrigins = null;
      selectionBox = null;
      pressedStarInSelect = null;
      toggledSameStarInDown = false;
      eraseSnapshot = null;
      eraseDidDelete = false;

      if (isTouch) {
        hoveredStar = null;
        isPointerInside = false;
      }

      updateCursor(isTouch);
    }

    window.addEventListener('pointerup', e => finishPointer(e, false));
    window.addEventListener('pointercancel', e => finishPointer(e, true));

    canvas.addEventListener('pointerenter', e => {
      if (e.pointerType === 'mouse') isPointerInside = true;
    });
    canvas.addEventListener('pointerleave', e => {
      if (e.pointerType === 'mouse') {
        isPointerInside = false;
        hoveredStar = null;
      }
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    // バイエル符号割り当て用の等級順ソート
    function getSortedStarsForBayer() {
      return [...stars].sort((a, b) => {
        if (b.size !== a.size) return b.size - a.size;
        if (Math.abs(a.nx - b.nx) > 1e-4) return a.nx - b.nx;
        return a.ny - b.ny;
      });
    }

    function drawCelestialGrid(c, w, h, scale, isExport = false) {
      if (!showGrid && !isExport) return;
      const cx = w / 2;
      const cy = h / 2;
      const maxR = Math.hypot(w, h) * 0.55;

      c.save();
      if (showGrid) {
        c.strokeStyle = 'rgba(180, 200, 235, 0.045)';
        c.lineWidth = isExport ? 1.2 : 1;

        const rings = [0.2, 0.4, 0.65, 0.95];
        for (const rFactor of rings) {
          c.beginPath();
          c.arc(cx, cy, scale * rFactor, 0, Math.PI * 2);
          c.stroke();
        }

        for (let i = 0; i < 12; i++) {
          const angle = (i * Math.PI) / 6;
          c.beginPath();
          c.moveTo(cx + Math.cos(angle) * (scale * 0.08), cy + Math.sin(angle) * (scale * 0.08));
          c.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
          c.stroke();
        }
      }

      if (isExport) {
        const m = w < 1150 ? 40 : 36;
        c.strokeStyle = 'rgba(212, 180, 131, 0.28)';
        c.lineWidth = 1.2;
        c.strokeRect(m, m, w - m * 2, h - m * 2);

        const tick = 10;
        c.strokeStyle = 'rgba(212, 180, 131, 0.68)';
        c.beginPath();
        c.moveTo(m, m + tick); c.lineTo(m, m); c.lineTo(m + tick, m);
        c.moveTo(w - m - tick, m); c.lineTo(w - m, m); c.lineTo(w - m, m + tick);
        c.moveTo(m, h - m - tick); c.lineTo(m, h - m); c.lineTo(m + tick, h - m);
        c.moveTo(w - m - tick, h - m); c.lineTo(w - m, h - m); c.lineTo(w - m, h - m - tick);
        c.stroke();
      }
      c.restore();
    }

    function wrapLines(c, text, maxWidth, maxLines = 4) {
      const result = [];
      for (const paragraph of text.split(/\r?\n/)) {
        let current = '';
        for (const ch of paragraph) {
          const test = current + ch;
          if (c.measureText(test).width > maxWidth && current.length > 0) {
            result.push(current);
            current = ch;
          } else {
            current = test;
          }
        }
        result.push(current);
      }
      return result.filter((_, idx, arr) => idx < maxLines && (arr[idx] !== '' || arr.length === 1));
    }

    function drawSingleStar(c, p, size, color, highlightColor = null, alpha = 1, pulseScale = 1) {
      if (alpha <= 0.005) return;
      c.save();
      c.globalAlpha *= alpha;
      const haloR = size * 4.2 * pulseScale;
      const halo = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloR);
      halo.addColorStop(0, hexToRgba(color, 1));
      halo.addColorStop(0.18, hexToRgba(color, 0.42));
      halo.addColorStop(0.5, hexToRgba(color, 0.08));
      halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
      c.fillStyle = halo;
      c.beginPath();
      c.arc(p.x, p.y, haloR, 0, Math.PI * 2);
      c.fill();

      if (size >= 4.5) {
        const sp = size * 2.5 * pulseScale;
        c.strokeStyle = hexToRgba(color, 0.34);
        c.lineWidth = 0.75;
        c.beginPath();
        c.moveTo(p.x - sp, p.y); c.lineTo(p.x + sp, p.y);
        c.moveTo(p.x, p.y - sp); c.lineTo(p.x, p.y + sp);
        c.stroke();
      }

      c.fillStyle = '#ffffff';
      c.beginPath();
      c.arc(p.x, p.y, size * 0.52, 0, Math.PI * 2);
      c.fill();

      if (highlightColor) {
        const r = size + 8;
        c.strokeStyle = highlightColor;
        c.lineWidth = 1;
        c.beginPath();
        c.arc(p.x, p.y, r, 0, Math.PI * 2);
        c.stroke();
      }
      c.restore();
    }

    // アニメーションタイムラインの進捗計算
    function getPlaybackMetrics(nowMs) {
      const elapsed = Math.max(0, nowMs - playback.startTime);
      const tQuiet = 360;
      const tStarsEnd = tQuiet + Math.max(0, stars.length - 1) * playback.starDelay + playback.starFade;
      const tLinesStart = stars.length > 0 ? tStarsEnd + 160 : tQuiet;
      const tLinesEnd = tLinesStart + lines.length * playback.lineDur;
      const tCaptionStart = tLinesEnd + 180;
      const tCaptionEnd = tCaptionStart + playback.captionFade;
      const totalDur = tCaptionEnd + playback.holdEnd;
      return {
        elapsed,
        tQuiet,
        tStarsEnd,
        tLinesStart,
        tLinesEnd,
        tCaptionStart,
        tCaptionEnd,
        totalDur
      };
    }

    // 共通レンダラー（通常・書き出し・再生録画のすべてに対応）
    function renderToContext(c, w, h, scale, time, isExport = false, exportOptions = null) {
      c.clearRect(0, 0, w, h);

      const bg = c.createRadialGradient(
        w * 0.5, h * 0.45, 0,
        w * 0.5, h * 0.5, Math.max(w, h) * 0.8
      );
      bg.addColorStop(0, '#0c1220');
      bg.addColorStop(0.65, '#070a12');
      bg.addColorStop(1, '#040508');
      c.fillStyle = bg;
      c.fillRect(0, 0, w, h);

      drawCelestialGrid(c, w, h, scale, isExport);

      const bgStarScale = isExport ? 1.25 : 1;
      for (const s of bgStars) {
        const twinkle = Math.sin(time * s.speed + s.phase) * 0.14;
        c.globalAlpha = Math.max(0.04, Math.min(0.8, s.alpha + twinkle));
        c.fillStyle = s.tint;
        c.beginPath();
        c.arc(s.u * w, s.v * h, s.r * bgStarScale, 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;

      // 再生中進捗
      const isPlaying = !isExport && playback.active;
      const pb = isPlaying ? getPlaybackMetrics(performance.now()) : null;

      const starMap = new Map(stars.map(s => [s.id, s]));
      const sizeMul = isExport ? Math.max(0.85, Math.min(1.4, scale / 900)) : 1;

      // 星座線
      c.save();
      c.lineWidth = isExport ? 1.45 : 1.15;
      c.strokeStyle = 'rgba(220, 228, 242, 0.58)';
      if (lineStyle === 'dashed') {
        c.setLineDash(isExport ? [6, 7] : [4, 5]);
      }

      for (let i = 0; i < lines.length; i++) {
        const l = lines[i];
        const s1 = starMap.get(l.from);
        const s2 = starMap.get(l.to);
        if (!s1 || !s2) continue;

        let lineProgress = 1;
        if (isPlaying) {
          const lineStart = pb.tLinesStart + i * playback.lineDur;
          lineProgress = easeInOutCubic((pb.elapsed - lineStart) / playback.lineDur);
          if (lineProgress <= 0) continue;
        }

        const p1 = toScreen(s1.nx, s1.ny, w, h, scale);
        const p2 = toScreen(s2.nx, s2.ny, w, h, scale);
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dist = Math.hypot(dx, dy);

        const gap1 = s1.size * sizeMul + 6.5 * sizeMul;
        const gap2 = s2.size * sizeMul + 6.5 * sizeMul;

        if (dist > gap1 + gap2) {
          const ux = dx / dist;
          const uy = dy / dist;
          const startX = p1.x + ux * gap1;
          const startY = p1.y + uy * gap1;
          const endX = p2.x - ux * gap2;
          const endY = p2.y - uy * gap2;
          const curX = startX + (endX - startX) * lineProgress;
          const curY = startY + (endY - startY) * lineProgress;

          c.beginPath();
          c.moveTo(startX, startY);
          c.lineTo(curX, curY);
          c.stroke();
        }
      }

      if (!isExport && !isViewMode && mode === 'connect' && selectedStar && isPointerDown) {
        const p1 = toScreen(selectedStar.nx, selectedStar.ny, w, h, scale);
        c.setLineDash([3, 4]);
        c.strokeStyle = 'rgba(212, 180, 131, 0.72)';
        c.beginPath();
        c.moveTo(p1.x, p1.y);
        c.lineTo(pointerPos.x, pointerPos.y);
        c.stroke();
      }
      c.restore();

      const previewBoxSet = (!isExport && !isViewMode && mode === 'select' && selectionBox && didMove)
        ? new Set(getStarsInBox(selectionBox))
        : null;

      // 孤立星パルス誘導用の接続セット
      let connectedIds = null;
      let challengePrimaryId = null;
      if (!isExport && !isViewMode && isolatedGuideMode !== 'none' && mode === 'connect') {
        connectedIds = new Set();
        lines.forEach(l => { connectedIds.add(l.from); connectedIds.add(l.to); });
        if (isolatedGuideMode === 'challenge' && stars.length > 0 && lines.length === 0) {
          challengePrimaryId = getSortedStarsForBayer()[0].id;
        }
      }

      // バイエル符号マップ（書き出し時のみ）
      let bayerById = null;
      let sortedForExport = null;
      if (isExport) {
        sortedForExport = getSortedStarsForBayer();
        bayerById = new Map();
        sortedForExport.forEach((st, idx) => {
          if (idx < GREEK_BAYER.length) {
            bayerById.set(st.id, GREEK_BAYER[idx]);
          }
        });
      }

      // 確定済みの恒星
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        const p = toScreen(s.nx, s.ny, w, h, scale);

        let starAlpha = 1;
        let pulseScale = 1;
        if (isPlaying) {
          const stStart = pb.tQuiet + i * playback.starDelay;
          const raw = (pb.elapsed - stStart) / playback.starFade;
          if (raw <= 0) continue;
          const eased = easeOutCubic(raw);
          starAlpha = eased;
          // 灯る瞬間に柔らかな光の膨張→収束
          pulseScale = raw < 1 ? (0.4 + Math.sin(eased * Math.PI) * 0.65 + eased * 0.6) : 1;
        }

        let highlight = null;
        if (!isExport && !isViewMode) {
          if (selectedStar && selectedStar.id === s.id) {
            highlight = '#d4b483';
          } else if (draggingStar && draggingStar.id === s.id) {
            highlight = '#d4b483';
          } else if (mode === 'select' && (selectedStarIds.has(s.id) || (previewBoxSet && previewBoxSet.has(s.id)))) {
            highlight = '#d4b483';
          } else if (hoveredStar && hoveredStar.id === s.id) {
            highlight = 'rgba(255, 255, 255, 0.45)';
          }
        }

        drawSingleStar(c, p, s.size * sizeMul, s.color, highlight, starAlpha, pulseScale);

        // 控えめな孤立星パルス誘導（結ばれると消える）
        if (connectedIds) {
          const shouldPulse = isolatedGuideMode === 'isolated'
            ? !connectedIds.has(s.id)
            : (s.id === challengePrimaryId);
          if (shouldPulse && (!selectedStar || selectedStar.id !== s.id)) {
            const wave = (Math.sin(time * 0.055) + 1) * 0.5;
            c.save();
            c.strokeStyle = `rgba(212, 180, 131, ${0.18 + wave * 0.44})`;
            c.lineWidth = 1;
            c.beginPath();
            c.arc(p.x, p.y, s.size + 8 + wave * 6, 0, Math.PI * 2);
            c.stroke();
            c.restore();
          }
        }

        // バイエル符号印字（書き出し時）
        if (isExport && bayerById && bayerById.has(s.id)) {
          const sym = bayerById.get(s.id);
          const starR = s.size * sizeMul;
          c.save();
          c.font = '400 13px "Shippori Mincho", serif';
          c.fillStyle = 'rgba(212, 180, 131, 0.72)';
          c.textAlign = 'left';
          c.textBaseline = 'top';
          c.fillText(sym, p.x + starR + 5, p.y + starR + 2);
          c.restore();
        }
      }

      // 範囲選択ボックス
      if (!isExport && !isViewMode && mode === 'select' && isPointerDown && selectionBox && didMove) {
        const x = Math.min(selectionBox.x1, selectionBox.x2);
        const y = Math.min(selectionBox.y1, selectionBox.y2);
        const bw = Math.abs(selectionBox.x2 - selectionBox.x1);
        const bh = Math.abs(selectionBox.y2 - selectionBox.y1);
        c.save();
        c.fillStyle = 'rgba(212, 180, 131, 0.08)';
        c.strokeStyle = 'rgba(212, 180, 131, 0.72)';
        c.lineWidth = 1;
        c.setLineDash([4, 4]);
        c.fillRect(x, y, bw, bh);
        c.strokeRect(x, y, bw, bh);
        c.restore();
      }

      // 配置モード：長押し位置合わせ
      if (!isExport && !isViewMode && mode === 'place' && isPointerDown && placingStar) {
        const p = toScreen(placingStar.nx, placingStar.ny, w, h, scale);
        c.save();
        const armInner = placingStar.size + 10;
        const armOuter = placingStar.size + 36;
        c.strokeStyle = 'rgba(212, 180, 131, 0.55)';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(p.x - armOuter, p.y); c.lineTo(p.x - armInner, p.y);
        c.moveTo(p.x + armInner, p.y); c.lineTo(p.x + armOuter, p.y);
        c.moveTo(p.x, p.y - armOuter); c.lineTo(p.x, p.y - armInner);
        c.moveTo(p.x, p.y + armInner); c.lineTo(p.x, p.y + armOuter);
        c.stroke();
        c.restore();
        drawSingleStar(c, p, placingStar.size, placingStar.color, 'rgba(212, 180, 131, 0.85)');
      }

      // 削除モード：消しゴム範囲表示
      const showEraserRing = !isExport && !isViewMode && mode === 'erase' &&
        (isPointerDown || (lastPointerType === 'mouse' && isPointerInside));
      if (showEraserRing) {
        c.save();
        c.strokeStyle = isPointerDown ? 'rgba(217, 124, 124, 0.85)' : 'rgba(217, 124, 124, 0.45)';
        c.fillStyle = isPointerDown ? 'rgba(217, 124, 124, 0.09)' : 'rgba(217, 124, 124, 0.03)';
        c.lineWidth = 1.2;
        c.setLineDash([4, 4]);
        c.beginPath();
        c.arc(pointerPos.x, pointerPos.y, eraserRadius, 0, Math.PI * 2);
        c.fill();
        c.stroke();
        c.restore();
      }

      // 動画録画中のみCanvas内に銘板文字を焼き込む
      if (!isExport && recorderState.recording && isPlaying) {
        const capAlpha = easeOutCubic((pb.elapsed - pb.tCaptionStart) / playback.captionFade);
        if (capAlpha > 0.01) {
          const title = nameInput.value.trim();
          const story = storyInput.value.trim();
          c.save();
          c.globalAlpha = capAlpha;
          c.textAlign = 'center';
          const maxCapW = Math.min(560, w * 0.84);
          let storyLines = [];
          if (story) {
            c.font = `400 ${Math.max(11, Math.min(13, w * 0.018))}px "Noto Sans JP", sans-serif`;
            storyLines = wrapLines(c, story, maxCapW, 3);
          }
          const lineH = 20;
          const bottomBase = h - 38;
          const storyH = storyLines.length * lineH;
          if (title) {
            const titleY = bottomBase - storyH - (storyLines.length > 0 ? 14 : 0);
            c.font = `400 ${Math.max(18, Math.min(26, w * 0.026))}px "Shippori Mincho", serif`;
            c.fillStyle = 'rgba(236, 239, 244, 0.94)';

              c.fillText(line, w / 2, bottomBase - (storyLines.length - 1 - idx) * lineH);
            });
          }
          c.restore();
        }
      }

      // 書き出し時のヘッダーメタ・タイトル銘板・Colophon
      if (isExport) {
        const m = w < 1150 ? 40 : 36;
        const title = nameInput.value.trim();
        const story = storyInput.value.trim();
        const today = new Date().toISOString().slice(0, 10).replace(/-/g, '.');
        const primaryCoord = sortedForExport && sortedForExport.length > 0
          ? calcCelestialCoord(sortedForExport[0].nx, sortedForExport[0].ny)
          : { ra: '00h 00m', dec: '+00° 00\'' };

        c.save();
        // 左上メタ
        c.font = '400 12px "IBM Plex Mono", monospace';
        c.fillStyle = 'rgba(212, 180, 131, 0.78)';
        c.textAlign = 'left';
        c.fillText(`ASTERISM  /  ${today}  /  ${stars.length} STARS`, m + 20, m + 30);

        c.font = '400 11px "IBM Plex Mono", monospace';
        c.fillStyle = 'rgba(138, 147, 166, 0.72)';
        c.fillText(`α  ${primaryCoord.ra}   ${primaryCoord.dec}`, m + 20, m + 49);

        // 右上シード表記
        if (currentSeedLabel) {
          c.textAlign = 'right';
          c.fillStyle = 'rgba(212, 180, 131, 0.65)';
          c.fillText(`CIPHER: ${currentSeedLabel}`, w - m - 20, m + 30);
        }

        // 中央下 銘板
        const maxTextWidth = Math.min(740, w - m * 2 - 72);
        let storyLines = [];
        if (story) {
          c.font = '400 15px "Noto Sans JP", sans-serif';
          storyLines = wrapLines(c, story, maxTextWidth, 4);
        }

        const lineH = 24;
        const bottomBase = h - m - 34;
        const storyBlockH = storyLines.length * lineH;

        c.textAlign = 'center';
        if (title) {

          storyLines.forEach((line, idx) => {
