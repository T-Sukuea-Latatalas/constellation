<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ASTERISM — 天球製図室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-void: #05070c;
      --surface: rgba(11, 14, 22, 0.86);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.22);
      --brass: #d4b483;
      --brass-dim: rgba(212, 180, 131, 0.16);
      --text-primary: #eceff4;
      --text-secondary: #8a93a6;
      --text-muted: #525a6b;
      --dock-offset: 84px;
      --font-serif: 'Shippori Mincho', serif;
      --font-sans: 'Noto Sans JP', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    body.view-mode canvas {
      cursor: default !important;
    }

    .chrome {
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 6px;
      transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 左上：タイトルマーク */
    .brand {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      z-index: 10;
      display: flex;
      align-items: baseline;
      gap: 10px;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.22em;
      color: var(--text-primary);
    }

    .brand-sub {
      font-family: var(--font-serif);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: var(--text-secondary);
    }

    /* 左下：座標テレメトリ */
    .telemetry {
      position: fixed;
      bottom: calc(18px + env(safe-area-inset-bottom));
      left: calc(18px + env(safe-area-inset-left));
      z-index: 5;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      line-height: 1.6;
      pointer-events: none;
      transition: opacity 0.28s ease;
    }

    .telemetry span {
      color: var(--text-secondary);
    }

    /* 右上：記録・設定ドロワー */
    .inspector {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 15;
      width: 272px;
      max-width: calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right));
      max-height: calc(100dvh - 100px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .inspector.collapsed {
      width: auto;
      max-height: none;
    }

    .inspector-toggle {
      width: 100%;
      flex-shrink: 0;
      background: transparent;
      border: none;
      color: var(--text-primary);
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 0.06em;
    }

    .inspector-toggle:hover {
      background: var(--surface-hover);
    }

    .inspector-toggle-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .inspector-body {
      padding: 4px 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .inspector.collapsed .inspector-body {
      display: none;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }

    .field-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    input[type="text"], textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 7px 9px;
      color: var(--text-primary);
      font-family: var(--font-serif);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      user-select: text;
      -webkit-user-select: text;
    }

    textarea {
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.55;
      min-height: 68px;
      max-height: 140px;
      resize: vertical;
    }

    input[type="text"]::placeholder, textarea::placeholder {
      color: var(--text-muted);
      font-size: 12px;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--brass);
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .seg-control {
      display: flex;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background 0.15s, color 0.15s;
    }

    .seg-btn.active {
      background: var(--brass-dim);
      color: var(--brass);
    }

    /* 下部ドック（操作バー） */
    .dock {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 5px 6px;
      width: max-content;
      max-width: calc(100vw - 24px - env(safe-area-inset-left) - env(safe-area-inset-right));
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .dock-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }

    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      padding: 6px 9px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-sans);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }

    .tool-btn:hover {
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .tool-btn.active {
      color: var(--brass);
      background: var(--brass-dim);
      border-color: rgba(212, 180, 131, 0.35);
    }

    .tool-btn.export-btn {
      color: var(--text-primary);
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.04);
    }

    .tool-btn.export-btn:hover {
      border-color: var(--brass);
      color: var(--brass);
    }

    .tool-btn:disabled {
      opacity: 0.32;
      pointer-events: none;
    }

    .mag-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 0 2px;
    }

    .mag-btn {
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      width: 24px;
      height: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mag-btn:hover {
      color: var(--text-primary);
    }

    .mag-btn.active {
      color: var(--brass);
      border-color: rgba(212, 180, 131, 0.4);
      background: var(--brass-dim);
    }

    .spectral-group {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 6px;
    }

    .spectral-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.25);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      padding: 0;
    }

    .spectral-dot.active {
      transform: scale(1.22);
      border-color: #ffffff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.22);
    }

    /* 夜空のタイトル銘板（プレビュー表示） */
    .plate-caption {
      position: fixed;
      bottom: var(--dock-offset);
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      text-align: center;
      pointer-events: none;
      width: min(84vw, 560px);
      transition: bottom 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease;
    }

    .plate-caption h2 {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: clamp(18px, 2.6vw, 26px);
      letter-spacing: 0.22em;
      color: rgba(236, 239, 244, 0.92);
    }

    .plate-caption p {
      margin: 6px 0 0;
      font-size: clamp(11px, 1.4vw, 12.5px);
      color: rgba(168, 178, 198, 0.78);
      line-height: 1.65;
      letter-spacing: 0.04em;
      word-break: break-word;
    }

    /* テキスト入力中 */
    body.editing-text .dock,
    body.editing-text .plate-caption {
      opacity: 0;
      pointer-events: none;
    }

    /* 鑑賞モード */
    body.view-mode .chrome:not(.exit-view),
    body.view-mode .brand,
    body.view-mode .telemetry {
      opacity: 0;
      pointer-events: none;
    }

    body.view-mode .plate-caption {
      bottom: calc(36px + env(safe-area-inset-bottom));
    }

    .exit-view {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: calc(14px + env(safe-area-inset-right));
      z-index: 20;
      opacity: 0;
      pointer-events: none;
    }

    body.view-mode .exit-view {
      opacity: 0.88;
      pointer-events: auto;
    }

    svg.icon {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 1.4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    @media (max-width: 920px) {
      .telemetry { display: none; }
      .dock-sep { display: none; }
      .dock {
        gap: 3px 6px;
        padding: 5px 8px;
      }
    }

    @media (max-width: 640px) {
      .brand-sub { display: none; }
      .inspector:not(.collapsed) {
        top: calc(48px + env(safe-area-inset-top));
        width: calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right));
        max-height: calc(100dvh - 140px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      }
      .tool-btn .label-text {
        display: none;
      }
      .tool-btn.show-label .label-text {
        display: inline;
      }
      .tool-btn {
        padding: 6px 8px;
      }
    }
  </style>
</head>
<body>

  <canvas id="skyCanvas"></canvas>

  <!-- 左上ブランド -->
  <div class="brand">
    <span class="brand-title">ASTERISM</span>
    <span class="brand-sub">天球製図室</span>
  </div>

  <!-- 左下テレメトリ -->
  <div class="telemetry" id="telemetry">
    RA <span id="coordRA">12h 00m</span> &nbsp;/&nbsp; DEC <span id="coordDec">+00° 00'</span><br>
    STARS <span id="starCount">0</span> &nbsp;·&nbsp; SEGMENTS <span id="lineCount">0</span>
  </div>

  <!-- 右上：記録・表示設定パネル -->
  <aside class="chrome inspector" id="inspector">
    <button class="inspector-toggle" id="inspectorToggle" type="button">
      <span class="inspector-toggle-left">
        <svg class="icon" viewBox="0 0 16 16"><path d="M3 2.5h10v11H3z"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3"/></svg>
        <span>星図の記録</span>
      </span>
      <svg class="icon" id="chevronIcon" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
    </button>

    <div class="inspector-body">
      <div class="field">
        <label class="field-label" for="constellationName">Designation / 星座名</label>
        <input type="text" id="constellationName" placeholder="名称を入力" maxlength="28">
      </div>
      <div class="field">
        <label class="field-label" for="constellationStory">Notes / 観測記録・由来</label>
        <textarea id="constellationStory" placeholder="星図に添える覚え書き"></textarea>
      </div>
      <div class="setting-row">
        <span>座標グリッド</span>
        <div class="seg-control" id="gridToggle">
          <button class="seg-btn active" data-val="on" type="button">表示</button>
          <button class="seg-btn" data-val="off" type="button">非表示</button>
        </div>
      </div>
      <div class="setting-row">
        <span>星座線の線種</span>
        <div class="seg-control" id="lineStyleToggle">
          <button class="seg-btn active" data-val="solid" type="button">実線</button>
          <button class="seg-btn" data-val="dashed" type="button">破線</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- 銘板キャプション -->
  <div class="plate-caption">
    <h2 id="captionTitle"></h2>
    <p id="captionStory"></p>
  </div>

  <!-- 下部ツールバー -->
  <nav class="chrome dock" id="dock" aria-label="製図ツール">
    <div class="dock-group">
      <button class="tool-btn active show-label" data-mode="place" type="button" title="星を配置 / ドラッグで移動 (1)">
        <svg class="icon" viewBox="0 0 16 16"><path d="M8 2v3M8 11v3M2 8h3M11 8h3"/><circle cx="8" cy="8" r="1.4"/></svg>
        <span class="label-text">配置</span>
      </button>
      <button class="tool-btn show-label" data-mode="connect" type="button" title="星同士を繋ぐ (2)">
        <svg class="icon" viewBox="0 0 16 16"><circle cx="3.5" cy="12" r="1.6"/><circle cx="12.5" cy="4" r="1.6"/><path d="M4.8 10.8L11.2 5.2"/></svg>
        <span class="label-text">結線</span>
      </button>
      <button class="tool-btn show-label" data-mode="erase" type="button" title="星や線を消す (3)">
        <svg class="icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        <span class="label-text">削除</span>
      </button>
    </div>

    <div class="dock-sep"></div>

    <div class="dock-group" title="等級（明るさ）とスペクトル型">
      <div class="mag-group" id="magGroup">
        <button class="mag-btn" data-size="5.2" type="button" title="1等星">I</button>
        <button class="mag-btn active" data-size="3.6" type="button" title="2等星">II</button>
        <button class="mag-btn" data-size="2.3" type="button" title="3等星">III</button>
      </div>
      <div class="spectral-group" id="spectralGroup">
        <button class="spectral-dot active" data-color="#f2f6ff" style="background:#f2f6ff;" type="button" title="A型（純白）"></button>
        <button class="spectral-dot" data-color="#9ec5ff" style="background:#9ec5ff;" type="button" title="B型（青白）"></button>
        <button class="spectral-dot" data-color="#ffe7ba" style="background:#ffe7ba;" type="button" title="G型（黄白）"></button>
        <button class="spectral-dot" data-color="#ffb88c" style="background:#ffb88c;" type="button" title="K型（橙）"></button>
      </div>
    </div>

    <div class="dock-sep"></div>

    <div class="dock-group">
      <button class="tool-btn" id="scatterBtn" type="button" title="ランダムに星を散らす">
        <svg class="icon" viewBox="0 0 16 16"><circle cx="4" cy="5" r="0.9"/><circle cx="11.5" cy="4" r="0.9"/><circle cx="8" cy="9" r="0.9"/><circle cx="4.5" cy="12" r="0.9"/><circle cx="12" cy="11.5" r="0.9"/></svg>
        <span class="label-text">散星</span>
      </button>
      <button class="tool-btn" id="undoBtn" type="button" title="1つ戻す (Ctrl/Cmd+Z)" disabled>
        <svg class="icon" viewBox="0 0 16 16"><path d="M5 6.5H2.5V4"/><path d="M2.8 6.5A5.2 5.2 0 1 1 4 12.2"/></svg>
        <span class="label-text">戻す</span>
      </button>
      <button class="tool-btn" id="clearBtn" type="button" title="全消去">
        <svg class="icon" viewBox="0 0 16 16"><path d="M2.5 4.5h11M6 4.5V3h4v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>
        <span class="label-text">消去</span>
      </button>
    </div>

    <div class="dock-sep"></div>

    <div class="dock-group">
      <button class="tool-btn" id="viewBtn" type="button" title="鑑賞モード (H)">
        <svg class="icon" viewBox="0 0 16 16"><path d="M2 5.5V3h2.5M14 5.5V3h-2.5M2 10.5V13h2.5M14 10.5V13h-2.5"/></svg>
        <span class="label-text">鑑賞</span>
      </button>
      <button class="tool-btn export-btn show-label" id="exportBtn" type="button" title="星図をPNG画像として書き出す">
        <svg class="icon" viewBox="0 0 16 16"><path d="M8 2.5v7.5M5 7.5l3 3 3-3M3 12.5h10"/></svg>
        <span class="label-text">書き出し</span>
      </button>
    </div>
  </nav>

  <button class="chrome tool-btn exit-view" id="exitViewBtn" type="button">
    <svg class="icon" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    <span>編集に戻る</span>
  </button>

  <script>
    const canvas = document.getElementById('skyCanvas');
    const ctx = canvas.getContext('2d');

    const dock = document.getElementById('dock');
    const inspector = document.getElementById('inspector');
    const inspectorToggle = document.getElementById('inspectorToggle');
    const chevronIcon = document.getElementById('chevronIcon');
    const nameInput = document.getElementById('constellationName');
    const storyInput = document.getElementById('constellationStory');
    const captionTitle = document.getElementById('captionTitle');
    const captionStory = document.getElementById('captionStory');
    const coordRA = document.getElementById('coordRA');
    const coordDec = document.getElementById('coordDec');
    const starCountEl = document.getElementById('starCount');
    const lineCountEl = document.getElementById('lineCount');
    const undoBtn = document.getElementById('undoBtn');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = 1;

    let mode = 'place';
    let currentSize = 3.6;
    let currentColor = '#f2f6ff';
    let showGrid = true;
    let lineStyle = 'solid';

    let stars = [];
    let lines = [];
    let history = [];
    let nextId = 1;

    let bgStars = [];

    let hoveredStar = null;
    let draggingStar = null;
    let dragSnapshot = null;
    let selectedStar = null;
    let downPos = { x: 0, y: 0 };
    let pointerPos = { x: width / 2, y: height / 2 };
    let isPointerDown = false;
    let didMove = false;
    let activeTouchId = null;
    let isEditingText = false;
    let isViewMode = false;

    function hexToRgba(hex, alpha) {
      const clean = hex.replace('#', '');
      const full = clean.length === 3
        ? clean.split('').map(c => c + c).join('')
        : clean;
      const num = parseInt(full, 16);
      const r = (num >> 16) & 255;
      const g = (num >> 8) & 255;
      const b = num & 255;
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function getScale() {
      return Math.min(width, height);
    }

    function toScreen(nx, ny) {
      const s = getScale();
      return { x: width / 2 + nx * s, y: height / 2 + ny * s };
    }

    function toNorm(sx, sy) {
      const s = getScale();
      return { nx: (sx - width / 2) / s, ny: (sy - height / 2) / s };
    }

    function syncDockMetric() {
      const r = dock.getBoundingClientRect();
      if (r.height === 0) return;
      const offset = Math.max(0, height - r.top) + 18;
      document.documentElement.style.setProperty('--dock-offset', `${offset}px`);
    }

    function resize() {
      if (isEditingText) return;

      const rect = canvas.getBoundingClientRect();
      width = rect.width || window.innerWidth;
      height = rect.height || window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (bgStars.length === 0) {
        initBgStars();
      }
      updateTelemetry();
      requestAnimationFrame(syncDockMetric);
    }

    function initBgStars() {
      bgStars = [];
      const tints = ['#ffffff', '#dce8ff', '#fff0db', '#cfd9eb'];
      for (let i = 0; i < 280; i++) {
        bgStars.push({
          u: Math.random(),
          v: Math.random(),
          r: Math.random() * 1.1 + 0.25,
          alpha: Math.random() * 0.45 + 0.08,
          phase: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.015 + 0.004,
          tint: tints[Math.floor(Math.random() * tints.length)]
        });
      }
    }

    function updateTelemetry() {
      const norm = toNorm(pointerPos.x, pointerPos.y);
      const raRatio = Math.max(0, Math.min(0.999, (norm.nx + 0.85) / 1.7));
      const raTotalMin = Math.floor(raRatio * 24 * 60);
      const raH = String(Math.floor(raTotalMin / 60)).padStart(2, '0');
      const raM = String(raTotalMin % 60).padStart(2, '0');

      const decDegTotal = Math.max(-89, Math.min(89, Math.round(-norm.ny * 90)));
      const decSign = decDegTotal >= 0 ? '+' : '-';
      const decAbs = String(Math.abs(decDegTotal)).padStart(2, '0');

      coordRA.textContent = `${raH}h ${raM}m`;
      coordDec.textContent = `${decSign}${decAbs}° 00'`;
      starCountEl.textContent = stars.length;
      lineCountEl.textContent = lines.length;
    }

    function cloneState() {
      return {
        stars: stars.map(s => ({ ...s })),
        lines: lines.map(l => ({ ...l }))
      };
    }

    function pushSnapshot(snap) {
      history.push(snap);
      if (history.length > 50) history.shift();
      undoBtn.disabled = history.length === 0;
    }

    function saveHistory() {
      pushSnapshot(cloneState());
    }

    function undo() {
      if (isViewMode || history.length === 0) return;
      const prev = history.pop();
      stars = prev.stars;
      lines = prev.lines;
      selectedStar = null;
      draggingStar = null;
      undoBtn.disabled = history.length === 0;
      updateTelemetry();
    }

    function findStarAt(sx, sy, threshold = 24) {
      let hit = null;
      let minD = threshold;
      for (const s of stars) {
        const p = toScreen(s.nx, s.ny);
        const d = Math.hypot(p.x - sx, p.y - sy);
        if (d < minD) {
          minD = d;
          hit = s;
        }
      }
      return hit;
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function findLineAt(sx, sy, threshold = 14) {
      const starMap = new Map(stars.map(s => [s.id, s]));
      for (let i = 0; i < lines.length; i++) {
        const s1 = starMap.get(lines[i].from);
        const s2 = starMap.get(lines[i].to);
        if (!s1 || !s2) continue;
        const p1 = toScreen(s1.nx, s1.ny);
        const p2 = toScreen(s2.nx, s2.ny);
        if (distToSegment(sx, sy, p1.x, p1.y, p2.x, p2.y) < threshold) {
          return i;
        }
      }
      return -1;
    }

    function connectStars(s1, s2) {
      if (!s1 || !s2 || s1.id === s2.id) return false;
      const exists = lines.some(
        l => (l.from === s1.id && l.to === s2.id) || (l.from === s2.id && l.to === s1.id)
      );
      if (!exists) {
        saveHistory();
        lines.push({ from: s1.id, to: s2.id });
        updateTelemetry();
        return true;
      }
      return false;
    }

    function clientToCanvas(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    let toggledSameStarInDown = false;

    function handlePointerDown(pos) {
      if (isViewMode) return;

      downPos = { x: pos.x, y: pos.y };
      pointerPos = { x: pos.x, y: pos.y };
      isPointerDown = true;
      didMove = false;
      toggledSameStarInDown = false;
      updateTelemetry();

      const hit = findStarAt(pos.x, pos.y);

      if (mode === 'place') {
        if (hit) {
          draggingStar = hit;
          dragSnapshot = cloneState();
        }
      } else if (mode === 'connect') {
        if (hit) {
          if (selectedStar && selectedStar.id === hit.id) {
            toggledSameStarInDown = true;
          } else if (selectedStar && selectedStar.id !== hit.id) {
            connectStars(selectedStar, hit);
            selectedStar = hit;
          } else {
            selectedStar = hit;
          }
        } else {
          selectedStar = null;
        }
      } else if (mode === 'erase') {
        if (hit) {
          saveHistory();
          stars = stars.filter(s => s.id !== hit.id);
          lines = lines.filter(l => l.from !== hit.id && l.to !== hit.id);
          if (selectedStar && selectedStar.id === hit.id) selectedStar = null;
          hoveredStar = null;
          updateTelemetry();
        } else {
          const li = findLineAt(pos.x, pos.y);
          if (li !== -1) {
            saveHistory();
            lines.splice(li, 1);
            updateTelemetry();
          }
        }
      }
    }

    function handlePointerMove(pos, isTouch) {
      if (isViewMode) {
        hoveredStar = null;
        return;
      }

      if (isPointerDown && Math.hypot(pos.x - downPos.x, pos.y - downPos.y) > 6) {
        didMove = true;
      }
      pointerPos = { x: pos.x, y: pos.y };
      updateTelemetry();

      hoveredStar = isTouch ? null : findStarAt(pos.x, pos.y);

      if (mode === 'place' && draggingStar && isPointerDown && didMove) {
        const norm = toNorm(pos.x, pos.y);
        draggingStar.nx = norm.nx;
        draggingStar.ny = norm.ny;
      }

      if (!isTouch) {
        if (mode === 'erase') {
          canvas.style.cursor = (hoveredStar || findLineAt(pos.x, pos.y) !== -1) ? 'pointer' : 'crosshair';
        } else if (hoveredStar) {
          canvas.style.cursor = mode === 'place' ? 'grab' : 'pointer';
        } else {
          canvas.style.cursor = 'crosshair';
        }
      }
    }

    function handlePointerUp() {
      if (!isPointerDown) return;
      isPointerDown = false;

      if (isViewMode) {
        draggingStar = null;
        dragSnapshot = null;
        toggledSameStarInDown = false;
        return;
      }

      if (mode === 'place') {
        if (draggingStar) {
          if (didMove && dragSnapshot) {
            pushSnapshot(dragSnapshot);
          }
          draggingStar = null;
          dragSnapshot = null;
        } else if (!didMove) {
          saveHistory();
          const norm = toNorm(pointerPos.x, pointerPos.y);
          stars.push({
            id: nextId++,
            nx: norm.nx,
            ny: norm.ny,
            size: currentSize,
            color: currentColor
          });
          updateTelemetry();
        }
      } else if (mode === 'connect') {
        if (didMove && selectedStar) {
          const target = findStarAt(pointerPos.x, pointerPos.y, 28);
          if (target && target.id !== selectedStar.id) {
            connectStars(selectedStar, target);
            selectedStar = null;
          }
        } else if (!didMove && toggledSameStarInDown) {
          selectedStar = null;
        }
      }
      toggledSameStarInDown = false;
    }

    canvas.addEventListener('mousedown', e => {
      if (isViewMode || e.button !== 0) return;
      handlePointerDown(clientToCanvas(e.clientX, e.clientY));
    });
    window.addEventListener('mousemove', e => {
      if (isViewMode) return;
      handlePointerMove(clientToCanvas(e.clientX, e.clientY), false);
    });
    window.addEventListener('mouseup', () => {
      handlePointerUp();
    });
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    canvas.addEventListener('touchstart', e => {
      if (isViewMode) return;
      e.preventDefault();
      if (activeTouchId !== null) return;
      const t = e.changedTouches[0];
      activeTouchId = t.identifier;
      handlePointerDown(clientToCanvas(t.clientX, t.clientY));
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if (isViewMode || activeTouchId === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === activeTouchId) {
          e.preventDefault();
          handlePointerMove(clientToCanvas(t.clientX, t.clientY), true);
          break;
        }
      }
    }, { passive: false });

    function onTouchEndOrCancel(e) {
      if (activeTouchId === null) return;
      for (const t of e.changedTouches) {
        if (t.identifier === activeTouchId) {
          activeTouchId = null;
          handlePointerUp();
          break;
        }
      }
    }
    window.addEventListener('touchend', onTouchEndOrCancel);
    window.addEventListener('touchcancel', onTouchEndOrCancel);

    function drawCelestialGrid(isExport = false) {
      if (!showGrid && !isExport) return;
      const cx = width / 2;
      const cy = height / 2;
      const maxR = Math.hypot(width, height) * 0.55;
      const scale = getScale();

      ctx.save();
      if (showGrid) {
        ctx.strokeStyle = 'rgba(180, 200, 235, 0.045)';
        ctx.lineWidth = 1;

        const rings = [0.2, 0.4, 0.65, 0.95];
        for (const rFactor of rings) {
          ctx.beginPath();
          ctx.arc(cx, cy, scale * rFactor, 0, Math.PI * 2);
          ctx.stroke();
        }

        for (let i = 0; i < 12; i++) {
          const angle = (i * Math.PI) / 6;
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(angle) * (scale * 0.08), cy + Math.sin(angle) * (scale * 0.08));
          ctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
          ctx.stroke();
        }
      }

      if (isExport) {
        const m = Math.max(16, Math.min(28, width * 0.03));
        ctx.strokeStyle = 'rgba(212, 180, 131, 0.28)';
        ctx.lineWidth = 1;
        ctx.strokeRect(m, m, width - m * 2, height - m * 2);

        const tick = 8;
        ctx.strokeStyle = 'rgba(212, 180, 131, 0.65)';
        ctx.beginPath();
        ctx.moveTo(m, m + tick); ctx.lineTo(m, m); ctx.lineTo(m + tick, m);
        ctx.moveTo(width - m - tick, m); ctx.lineTo(width - m, m); ctx.lineTo(width - m, m + tick);
        ctx.moveTo(m, height - m - tick); ctx.lineTo(m, height - m); ctx.lineTo(m + tick, height - m);
        ctx.moveTo(width - m - tick, height - m); ctx.lineTo(width - m, height - m); ctx.lineTo(width - m, height - m - tick);
        ctx.stroke();
      }
      ctx.restore();
    }

    function wrapLines(text, maxWidth) {
      const result = [];
      for (const paragraph of text.split(/\r?\n/)) {
        let current = '';
        for (const ch of paragraph) {
          const test = current + ch;
          if (ctx.measureText(test).width > maxWidth && current.length > 0) {
            result.push(current);
            current = ch;
          } else {
            current = test;
          }
        }
        result.push(current);
      }
      return result.filter((_, idx, arr) => idx < 4 && (arr[idx] !== '' || arr.length === 1));
    }

    function render(time, isExport = false) {
      ctx.clearRect(0, 0, width, height);

      const bg = ctx.createRadialGradient(
        width * 0.5, height * 0.45, 0,
        width * 0.5, height * 0.5, Math.max(width, height) * 0.8
      );
      bg.addColorStop(0, '#0c1220');
      bg.addColorStop(0.65, '#070a12');
      bg.addColorStop(1, '#040508');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, width, height);

      drawCelestialGrid(isExport);

      for (const s of bgStars) {
        const twinkle = Math.sin(time * s.speed + s.phase) * 0.14;
        ctx.globalAlpha = Math.max(0.04, Math.min(0.8, s.alpha + twinkle));
        ctx.fillStyle = s.tint;
        ctx.beginPath();
        ctx.arc(s.u * width, s.v * height, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      const starMap = new Map(stars.map(s => [s.id, s]));

      ctx.save();
      ctx.lineWidth = 1.15;
      ctx.strokeStyle = 'rgba(220, 228, 242, 0.58)';
      if (lineStyle === 'dashed') {
        ctx.setLineDash([4, 5]);
      }

      for (const l of lines) {
        const s1 = starMap.get(l.from);
        const s2 = starMap.get(l.to);
        if (!s1 || !s2) continue;

        const p1 = toScreen(s1.nx, s1.ny);
        const p2 = toScreen(s2.nx, s2.ny);
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const dist = Math.hypot(dx, dy);

        const gap1 = s1.size + 6.5;
        const gap2 = s2.size + 6.5;

        if (dist > gap1 + gap2) {
          const ux = dx / dist;
          const uy = dy / dist;
          ctx.beginPath();
          ctx.moveTo(p1.x + ux * gap1, p1.y + uy * gap1);
          ctx.lineTo(p2.x - ux * gap2, p2.y - uy * gap2);
          ctx.stroke();
        }
      }

      if (!isExport && !isViewMode && mode === 'connect' && selectedStar) {
        const p1 = toScreen(selectedStar.nx, selectedStar.ny);
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(212, 180, 131, 0.72)';
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(pointerPos.x, pointerPos.y);
        ctx.stroke();
      }
      ctx.restore();

      for (const s of stars) {
        const p = toScreen(s.nx, s.ny);
        const isHovered = !isExport && !isViewMode && hoveredStar && hoveredStar.id === s.id;
        const isSelected = !isExport && !isViewMode && selectedStar && selectedStar.id === s.id;

        ctx.save();
        const haloR = s.size * 4.2;
        const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloR);
        halo.addColorStop(0, hexToRgba(s.color, 1));
        halo.addColorStop(0.18, hexToRgba(s.color, 0.4));
        halo.addColorStop(0.5, hexToRgba(s.color, 0.08));
        halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(p.x, p.y, haloR, 0, Math.PI * 2);
        ctx.fill();

        if (s.size >= 4.5) {
          const sp = s.size * 2.5;
          ctx.strokeStyle = hexToRgba(s.color, 0.34);
          ctx.lineWidth = 0.75;
          ctx.beginPath();
          ctx.moveTo(p.x - sp, p.y); ctx.lineTo(p.x + sp, p.y);
          ctx.moveTo(p.x, p.y - sp); ctx.lineTo(p.x, p.y + sp);
          ctx.stroke();
        }

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(p.x, p.y, s.size * 0.52, 0, Math.PI * 2);
        ctx.fill();

        if (isSelected || isHovered) {
          const r = s.size + 8;
          ctx.strokeStyle = isSelected ? '#d4b483' : 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      if (isExport) {
        const m = Math.max(16, Math.min(28, width * 0.03));
        const title = nameInput.value.trim();
        const story = storyInput.value.trim();
        const today = new Date().toISOString().slice(0, 10).replace(/-/g, '.');

        ctx.save();
        ctx.font = '400 10px "IBM Plex Mono", monospace';
        ctx.fillStyle = 'rgba(212, 180, 131, 0.72)';
        ctx.textAlign = 'left';
        ctx.fillText(`ASTERISM  /  ${today}  /  ${stars.length} STARS`, m + 14, m + 22);

        const maxTextWidth = Math.min(540, width - m * 2 - 40);
        let storyLines = [];
        if (story) {
          ctx.font = '400 12px "Noto Sans JP", sans-serif';
          storyLines = wrapLines(story, maxTextWidth);
        }

        const lineH = 19;
        const bottomBase = height - m - 22;
        const storyBlockH = storyLines.length * lineH;

        ctx.textAlign = 'center';
        if (title) {
          const titleY = bottomBase - storyBlockH - (storyLines.length > 0 ? 14 : 0);
          ctx.font = `400 ${Math.max(18, Math.min(26, width * 0.035))}px "Shippori Mincho", serif`;
          ctx.fillStyle = '#eceff4';
          ctx.fillText(title.split('').join(' '), width / 2, titleY);
        }

        if (storyLines.length > 0) {
          ctx.font = '400 12px "Noto Sans JP", sans-serif';
          ctx.fillStyle = 'rgba(180, 190, 208, 0.82)';
          storyLines.forEach((line, idx) => {
            const y = bottomBase - (storyLines.length - 1 - idx) * lineH;
            ctx.fillText(line, width / 2, y);
          });
        }
        ctx.restore();
      }
    }

    let frame = 0;
    function loop() {
      frame++;
      render(frame, false);
      requestAnimationFrame(loop);
    }

    // --- UI制御 ---
    function setMode(nextMode) {
      if (isViewMode) return;
      mode = nextMode;
      selectedStar = null;
      draggingStar = null;
      document.querySelectorAll('[data-mode]').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === nextMode);
      });
    }

    document.querySelectorAll('[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    document.querySelectorAll('#magGroup .mag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#magGroup .mag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSize = parseFloat(btn.dataset.size);
      });
    });

    document.querySelectorAll('#spectralGroup .spectral-dot').forEach(dot => {
      dot.addEventListener('click', () => {
        document.querySelectorAll('#spectralGroup .spectral-dot').forEach(d => d.classList.remove('active'));
        dot.classList.add('active');
        currentColor = dot.dataset.color;
      });
    });

    document.getElementById('scatterBtn').addEventListener('click', () => {
      if (isViewMode) return;
      saveHistory();
      const colors = ['#f2f6ff', '#9ec5ff', '#ffe7ba', '#ffb88c'];
      const sizes = [5.2, 3.6, 3.6, 2.3, 2.3];
      for (let i = 0; i < 11; i++) {
        stars.push({
          id: nextId++,
          nx: (Math.random() - 0.5) * 0.62,
          ny: (Math.random() - 0.5) * 0.48,
          size: sizes[Math.floor(Math.random() * sizes.length)],
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
      updateTelemetry();
      setMode('connect');
    });

    undoBtn.addEventListener('click', undo);

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (isViewMode || (stars.length === 0 && lines.length === 0)) return;
      saveHistory();
      stars = [];
      lines = [];
      selectedStar = null;
      draggingStar = null;
      updateTelemetry();
    });

    document.querySelectorAll('#gridToggle .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#gridToggle .seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        showGrid = btn.dataset.val === 'on';
      });
    });

    document.querySelectorAll('#lineStyleToggle .seg-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#lineStyleToggle .seg-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        lineStyle = btn.dataset.val;
      });
    });

    function setCollapsed(collapsed) {
      inspector.classList.toggle('collapsed', collapsed);
      chevronIcon.style.transform = collapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
    }

    inspectorToggle.addEventListener('click', () => {
      setCollapsed(!inspector.classList.contains('collapsed'));
    });

    if (window.innerWidth <= 920 || window.innerHeight <= 680) {
      setCollapsed(true);
    }

    function updateCaption() {
      captionTitle.textContent = nameInput.value.trim();
      captionStory.textContent = storyInput.value.trim();
    }
    nameInput.addEventListener('input', updateCaption);
    storyInput.addEventListener('input', updateCaption);

    [nameInput, storyInput].forEach(el => {
      el.addEventListener('focus', () => {
        isEditingText = true;
        document.body.classList.add('editing-text');
      });
      el.addEventListener('blur', () => {
        isEditingText = false;
        document.body.classList.remove('editing-text');
        window.scrollTo(0, 0);
        setTimeout(resize, 120);
      });
    });

    function toggleViewMode(force) {
      const next = force !== undefined ? force : !isViewMode;
      isViewMode = next;
      document.body.classList.toggle('view-mode', isViewMode);

      if (isViewMode) {
        if (document.activeElement && typeof document.activeElement.blur === 'function') {
          document.activeElement.blur();
        }
        selectedStar = null;
        draggingStar = null;
        dragSnapshot = null;
        hoveredStar = null;
        isPointerDown = false;
        activeTouchId = null;
      }
    }

    document.getElementById('viewBtn').addEventListener('click', () => toggleViewMode(true));
    document.getElementById('exitViewBtn').addEventListener('click', () => toggleViewMode(false));

    document.getElementById('exportBtn').addEventListener('click', () => {
      render(frame, true);
      const slug = (nameInput.value.trim() || 'asterism_chart').replace(/[\\/:*?"<>|]/g, '_');
      if (canvas.toBlob) {
        canvas.toBlob(blob => {
          if (!blob) return;
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.download = `${slug}.png`;
          link.href = url;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, 'image/png');
      } else {
        const link = document.createElement('a');
        link.download = `${slug}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }
      render(frame, false);
    });

    window.addEventListener('keydown', e => {
      if (document.activeElement === nameInput || document.activeElement === storyInput) return;

      if (isViewMode) {
        if (e.key.toLowerCase() === 'h' || e.key === 'Escape') {
          toggleViewMode(false);
        }
        return;
      }

      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') {
        e.preventDefault();
        undo();
      } else if (e.key === '1') setMode('place');
      else if (e.key === '2') setMode('connect');
      else if (e.key === '3') setMode('erase');
      else if (e.key.toLowerCase() === 'h') toggleViewMode(true);
      else if (e.key === 'Escape') selectedStar = null;
    });

    function initInitialChart() {
      const initialStars = [
        { nx: -0.18, ny: -0.14, size: 3.6, color: '#9ec5ff' },
        { nx: -0.07, ny: -0.06, size: 5.2, color: '#f2f6ff' },
        { nx:  0.04, ny: -0.13, size: 3.6, color: '#ffe7ba' },
        { nx:  0.14, ny: -0.04, size: 3.6, color: '#f2f6ff' },
        { nx:  0.02, ny:  0.08, size: 2.3, color: '#ffb88c' }
      ];
      initialStars.forEach(s => stars.push({ id: nextId++, ...s }));
      lines = [
        { from: 1, to: 2 },
        { from: 2, to: 3 },
        { from: 3, to: 4 },
        { from: 2, to: 5 }
      ];
      nameInput.value = '無名星図 I';
      storyInput.value = '';
      updateCaption();
      updateTelemetry();
    }

    if (window.ResizeObserver) {
      new ResizeObserver(syncDockMetric).observe(dock);
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncDockMetric);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 150));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', resize);
    }

    resize();
    pointerPos = { x: width / 2, y: height / 2 };
    initInitialChart();
    loop();
  </script>
</body>
</html>
